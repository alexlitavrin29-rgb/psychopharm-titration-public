- input_id: age
  question_ru: Возраст пациента, полных лет?
  data_type: integer
  unit: year
  allowed_values: []
  required_when: Only when explicitly supplied
  show_when: Only when explicitly supplied
  why_needed: Ограниченная взрослая источниковая справка не задаёт индивидуальную схему/срок и не устанавливает
    отсутствие текущего события. Возраст/событие — контекст при сообщении, counted; отсутствие/unknown явно unassessed.
    Известный симптом выбирает только своё опубликованное условие. Срочное источниковое действие требует фактического
    препарата и собственной подтверждённой фазы; справка не клинический допуск.
  changes:
  - applicability
  unknown_allowed: true
  action_if_unknown: insufficient_data; request this specific necessary fact; no individual dose
  source_refs:
  - RU-SER
  input_role: reported_source_information
  source_locator: §4.4 с.5, дети; §4.1 с.1
  missing_states:
  - unknown
  - not_assessed
  required_for_individual_result: false
  condition_effect: missing -> insufficient_data; confirmed source exclusion -> not_applicable; source caution ->
    clinician_choice unless an explicit source-specific decision is present
  value_aliases:
