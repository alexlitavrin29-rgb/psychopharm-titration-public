applicability:
  population_description: Взрослые от 18 лет; показание и клиническое действие выбирает врач.
  age_constraints:
  - minimum: 18
    inclusive: true
    unit: year
    source_ref: RU-PHEN
    source_locator: §1–3 с.1; §4.1–4.2 с.1–3; §4.3–4.4 с.3–4; §4.5–4.6 с.4–5
  pregnancy: Применение при беременности противопоказано; инструкция с.3–5. Это не разрешение резкой отмены уже
    принимаемого препарата.
  lactation: Период грудного вскармливания — противопоказание; с.3–5. Прекращение/снижение требует отдельного решения
    врача.
  renal_constraints:
  - При недостаточности функции почек — осторожность; при длительной терапии контроль, с.2/4. Числовой коэффициент
    не задан.
  hepatic_constraints:
  - При печёночной недостаточности — осторожность; при длительной терапии контроль печёночных ферментов/крови, с.2/4.
    Числовой коэффициент не задан.
  comorbidity_constraints:
  - Противопоказания включают миастению, острую дыхательную недостаточность, тяжёлую ХОБЛ, тяжёлую депрессию и острые
    отравления перечисленными веществами; с.3–5. Это не автоматический календарь отмены.
  interacting_drugs:
  - Взаимное усиление действия с другими средствами, угнетающими ЦНС, и этанолом; клозапин может усиливать угнетение
    дыхания; с.4. Требуется клинический разбор без выдуманной процентной поправки.
  other_conditions: []
  exclusions: []
  indication_status_in_russia: RU_indication_in_read_original_latest_registry_text_separate
  source_refs:
  - RU-PHEN
