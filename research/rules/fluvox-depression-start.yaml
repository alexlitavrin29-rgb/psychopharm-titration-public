logic:
  representation: conditional_source_rule
  conditions:
  - Применимость к указанному показанию/форме подтверждена в пределах дозового расчёта; это не полный клинический
    допуск.
  actions:
  - Старт 50 или 100 мг однократно вечером, по выбору врача. Через 3–4 недели пересмотр по клиническому опыту; опубликованного
    фиксированного следующего шага нет.
  - Дозы свыше 150 мг делят на 2 или 3 приёма; распределение не выбирать автоматически.
  - При почечной/печёночной недостаточности низкий старт под строгим контролем, конкретный коэффициент не задан.
    Детский ОКР не переносится на детскую тревогу/депрессию.
  - 'ИМАО одновременно противопоказаны. Начало флувоксамина: через 2 недели после необратимого ИМАО либо на следующий
    день после обратимого; перед любым ИМАО после флувоксамина не менее 1 недели (§4.3 с.3). Это проверка интервала
    одного препарата, не полноценная парная схема с дозой/российской регистрацией второго.'
  - При грудном вскармливании стандартный старт Феварина не выдаётся (§4.6 с.10); беременность требует исключительного
    отдельного решения. Низкий органный старт не выбирается автоматически из 50/100.
  parameter_refs:
  - start_options
  - maximum
  - review_time
  - divided_dose_threshold
  - irreversible_maoi_wait
  - reversible_maoi_next_day
  - to_maoi_wait
  source_refs:
  - RU-FLUVOX
  - RU-DEP
  clinician_choices:
  - Необходимость изменения лечения и неоценённые модулем клинические обстоятельства.
