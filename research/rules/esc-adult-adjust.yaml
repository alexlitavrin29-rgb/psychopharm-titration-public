logic:
  representation: narrative_only
  conditions:
  - Диагноз, препарат и режим выбрал врач. Соответствие популяции/форме и ограничения источника подтверждены.
  actions:
  - При недостаточном ответе врач может увеличить дозу до maximum; величина следующего шага и срок этим правилом
    не определены. Не вычислять их из GAD-7/PHQ-9.
  - Для пожилых/печени/CYP использовать отдельную применимую ветку; этот максимум не переносить туда автоматически.
  parameter_refs:
  - maximum
  - frequency
  - adult_minimum
  - source_form_strengths
  - renal_caution_threshold
  source_refs:
  - RU-ESC
  clinician_choices:
  - Применимость при особых состояниях и взаимодействиях
  - Необходимость следующего условного шага
  missing_data_behaviour: Назвать обязательные неизвестные поля; результат insufficient_data. Справочные этапы можно
    показать как условные, без безусловной дозы пациенту.
  unsupported_case_behaviour: not_applicable для этой карточки; указать конкретную отсутствующую ветку, не запретить
    всё лечение.
  contraindicated_case_behaviour: Не выдавать дозовую схему противопоказанного сочетания; отобразить источник и
    причину.
  conflicts: []
  composite_rule_dependencies: []
  combination_justification: Самостоятельные поправки не перемножаются. Совпадение числа не подтверждает применимость
    их сочетания.
  result_contract_ref: remediation_round3/result_contracts.yaml#rules/esc-adult-adjust
  individual_output_gate: All required typed inputs and applicable conditional inputs must be known; evaluate every
    source-specific gate in result_contract. A caution has clinician_choice, not an invented coefficient. No blanket
    clinical clearance.
  maoi_history_contract:
    source_ref: RU-ESC
    source_locator: §4.5 с.7–8
    irreversible_days: 14
    to_maoi_days: 7
    reversible: 'Moclobemide: at least one day; does not license all reversible MAOIs'
    fields:
    - medicines
    - maoi_type
    - maoi_stopped_at
    reference_time: external_context.calculation_at
    current_maoi: not_applicable standard branch; exceptional combinations remain physician decisions
    scope: ESC medication history, not a washout between the two SSRIs
  urgent_source_actions:
  - input: arrhythmia_signs
    equals: true
    actions:
    - action: discontinue_ESC
      source_ref: RU-ESC
      source_locator: §4.4 с.6
    - action: obtain_ECG
      source_ref: RU-ESC
      source_locator: §4.4 с.6
  - input: serotonin_syndrome_signs
    equals: true
    actions:
    - action: immediately_discontinue_SSRI_and_current_serotonergic_drugs
      source_ref: RU-ESC
      source_locator: §4.4 с.6
    - action: start_symptomatic_treatment_by_clinician
      source_ref: RU-ESC
      source_locator: §4.4 с.6
      automatic_medication_or_dose: null
  input_necessity_policy_ref: remediation_round3/necessity_decisions.json#esc-adult-adjust
