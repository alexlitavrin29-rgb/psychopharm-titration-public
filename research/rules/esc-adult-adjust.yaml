schema_version: '1.0'
rule_id: esc-adult-adjust
development_status: extracted_research_not_executable
language: ru
identity:
  title: 'Эсциталопрам: коррекция по ответу без фиксированного шага'
  mode: adjust
  drug_inn: эсциталопрам
  from_drug_inn: null
  to_drug_inn: null
  formulation: 'Селектра: таблетки, покрытые плёночной оболочкой; 5/10/15/20 мг; 10/15/20 делятся на равные дозы
    (§3 с.1–2)'
  route: oral
  diagnosis_label_ru: Показание врача, в границах исходного документа
  classification_system: МКБ-10
  diagnosis_code: F41.1/F41.0/F40.1
  jurisdiction: RU_registry_original_2025-11-05
  formulation_confirmation: '§3 с.1–2: equal halves for 10/15/20 mg; no half-dose claim for 5 mg'
applicability:
  population_description: Взрослые. Только подтверждённые условия этой карточки; другие популяции не получают масштабированную
    взрослую дозу.
  age_constraints:
  - minimum: 18
    inclusive: true
    unit: year
    source_ref: RU-ESC
    source_locator: §4.1 с.2; §4.2 с.3
  pregnancy: Решение по применимости/пользе и риску отдельно; без опубликованной числовой поправки. Стандартная
    карточка не выдаёт автоматическую дозу при беременности.
  lactation: Проверять отдельные ограничения источника. Стандартная карточка не выдаёт автоматическую дозу при кормлении.
  renal_constraints:
  - 'CLcr >30: no adjustment; CLcr <30: caution; exactly 30: source gap, physician decision (§4.2 с.3)'
  hepatic_constraints:
  - 'Child–Pugh A/B: initial 5 mg/day for first two weeks, then possible 10 by response; C: close physician supervision,
    no automatic numeric correction (§4.2 с.3)'
  comorbidity_constraints:
  - 'Мания/гипомания, судороги/неконтролируемая эпилепсия, суицидальный риск, акатизия, риск кровотечения, гипонатремии
    и удлинения QT: ограничения/наблюдение по инструкции; числовых множителей для них нет. Для эсциталопрама дополнительно
    диабет и закрытоугольная глаукома.'
  interacting_drugs: []
  other_conditions: []
  exclusions:
  - Гиперчувствительность
  - Непроверенные противопоказания/взаимодействия не считать отсутствующими
  indication_status_in_russia: confirmed_current_official_RU_ESC_SmPC
  source_refs:
  - RU-ESC
