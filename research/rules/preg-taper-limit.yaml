  necessity_reason: Обрабатывает отдельно сообщённое текущее источниковое событие при явном приёме соответствующего
    препарата. Не универсальный обязательный скрининг и не отрицание события при отсутствии/unknown. Положительный
    известный факт останавливает автоматический календарь и сохраняет опубликованный выбор врача; числовое снижение/немедленная
    отмена не придуманы.
  action_if_unknown: Explicit not_assessed; no clinical clearance. A reported unknown current event needs clinician
    assessment, not a confirmed negative or automatic calendar.
  fact_origin: explicitly supplied current physician event, not hidden pre-screening
