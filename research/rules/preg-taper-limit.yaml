    взрослой инструкции остаётся условной; unknown не подтверждает возраст. Индивидуальный срок/календарь и детский
    режим не рассчитываются. Для будущего индивидуального плана возраст станет отдельным обязательным входом.
  show_when: Для этого качественного источникового результата возраст — отдельно сообщённый контекст. Применимость
    взрослой инструкции остаётся условной; unknown не подтверждает возраст. Индивидуальный срок/календарь и детский
