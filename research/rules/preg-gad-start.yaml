schema_version: '1.0'
rule_id: preg-gad-start
development_status: extracted_research_not_executable
language: ru
identity:
  title: 'Прегабалин при ГТР: условная недельная схема'
  mode: start
  drug_inn: прегабалин
  from_drug_inn: null
  to_drug_inn: null
  formulation: 'Лирика: капсулы; 25/50/75/100/150/200/300 мг'
  route: oral
  diagnosis_label_ru: Генерализованное тревожное расстройство
  classification_system: МКБ-10
  diagnosis_code: F41.1
  jurisdiction: RU_versioned_copy
applicability:
  population_description: Взрослые. Только подтверждённые условия этой карточки; другие популяции не получают масштабированную
    взрослую дозу.
  age_constraints:
  - minimum: 18
    inclusive: true
    unit: year
    source_ref: RU-PREG
    source_locator: ОХЛП §4.2 PDF с.3–5; КР §3.2 с.24–25
  pregnancy: Решение по применимости/пользе и риску отдельно; без опубликованной числовой поправки. Стандартная
    карточка не выдаёт автоматическую дозу при беременности.
  lactation: Проверять отдельные ограничения источника. Стандартная карточка не выдаёт автоматическую дозу при кормлении.
  renal_constraints:
  - Для этой схемы CLcr ≥60 мл/мин и нет гемодиализа; иначе preg-renal-start. eGFR не эквивалент входа CLcr.
  hepatic_constraints:
  - Коррекция при нарушении печени не требуется (§4.2 с.5).
  comorbidity_constraints:
  - КР ГТР ограничивает применение при зависимости/склонности к злоупотреблению (§3.2 с.24–25).
  - Риск угнетения дыхания при дыхательных нарушениях, снижении функции почек, пожилом возрасте и депрессантах ЦНС
    (§4.4). Числовой множитель не опубликован.
  interacting_drugs: []
  other_conditions: []
  exclusions:
  - Гиперчувствительность
  - Непроверенные противопоказания/взаимодействия не считать отсутствующими
  indication_status_in_russia: RU_indication_in_read_copy_registry_row_observed_latest_text_identity_not_asserted
  source_refs:
  - RU-PREG
  - RU-GAD
