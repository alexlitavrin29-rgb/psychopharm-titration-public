  classification_system: МКБ-10
  diagnosis_code: F41.1/F32/F33
  jurisdiction: RU_versioned_sources
applicability:
  population_description: Взрослые от 18 лет; показание и клиническое действие выбирает врач.
  age_constraints:
  - minimum: 18
    inclusive: true
    unit: year
    source_ref: RU-AGO
    source_locator: §4.1–4.2 PDF с.1–2; §4.3–4.4 с.3–5; §4.5–4.6 с.5–6; §8–10 с.16
  pregnancy: Рекомендуется избегать назначения во время беременности; §4.6 PDF с.6. Числовой поправки нет.
  lactation: Риск для ребёнка не исключён; врач выбирает прекращение грудного вскармливания либо приёма препарата,
    §4.6 с.6. Не числовой коэффициент.
  renal_constraints: []
  hepatic_constraints: []
  comorbidity_constraints: []
  interacting_drugs: []
  other_conditions: []
  exclusions: []
  indication_status_in_russia: RU_indication_in_read_original_latest_registry_text_separate
  source_refs:
  - RU-AGO
  - RU-GAD
inputs:
- input_id: current_dose
  question_ru: Какова сообщённая исходная/последняя суточная доза курса (мг/сут) для контекста риска отмены? Она
    не подтверждает фазу текущего приёма.
  data_type: number
  unit: mg/day
  allowed_values: []
  required_when: Результат содержит только опубликованное ограничение/выбор врача, без расчёта индивидуальных ступеней,
    возобновляемой дозы или числового темпа. Текущая доза/длительность/прошлая отмена не операнды такого результата;
    известный контекст сохраняется, неизвестный явно not_assessed. Для последующего индивидуального плана эти сведения
    потребуются в отдельном контракте. Опубликованные условия срочного прекращения и текущие симптомы остаются обязательными.
  show_when: Если врач сообщает контекст; не обязательный этап выдачи ограниченного источникового результата
  why_needed: Результат содержит только опубликованное ограничение/выбор врача, без расчёта индивидуальных ступеней,
    возобновляемой дозы или числового темпа. Текущая доза/длительность/прошлая отмена не операнды такого результата;
    известный контекст сохраняется, неизвестный явно not_assessed. Для последующего индивидуального плана эти сведения
    потребуются в отдельном контракте. Опубликованные условия срочного прекращения и текущие симптомы остаются обязательными.
  changes:
  - dose_or_action
  unknown_allowed: true
  action_if_unknown: Show explicit not_assessed context warning; do not invent a numerical plan or grant clinical
    clearance
  source_refs:
  - RU-AGO
  input_role: reported_context
  source_locator: §4.1–4.2 PDF с.1–2; §4.3–4.4 с.3–5; §4.5–4.6 с.5–6; §8–10 с.16
  missing_states:
  - unknown
  - not_assessed
  required_for_individual_result: false
  condition_effect: missing -> insufficient_data; confirmed source exclusion -> not_applicable; source caution ->
    clinician_choice unless an explicit source-specific decision is present
  value_aliases:
    неизвестно: unknown
    не исследовано: not_assessed
    не помню: unknown
  requirement_predicate:
    kind: reported_context
  necessity_reason: Результат содержит только опубликованное ограничение/выбор врача, без расчёта индивидуальных
    ступеней, возобновляемой дозы или числового темпа. Текущая доза/длительность/прошлая отмена не операнды такого
    результата; известный контекст сохраняется, неизвестный явно not_assessed. Для последующего индивидуального
    плана эти сведения потребуются в отдельном контракте. Опубликованные условия срочного прекращения и текущие
    симптомы остаются обязательными.
  fact_origin: Explicitly reported initial/last daily course dose for source withdrawal context; no assertion of
    ongoing use. Current-treatment source action needs a separately supplied counted treatment phase.
  fact_semantics: reported_course_dose_without_current_use_confirmation
- input_id: clinician_action
  question_ru: Врач решил прекратить агомелатин?
  data_type: enum
  unit: null
  allowed_values:
  - keep
  - increase
  - decrease
  - stop
  - not_chosen
  - unknown
  - not_assessed
  required_when: 'для выбранного индивидуального результата: числовой операнд или явно проверяемое источниковое
    ограничение'
  show_when: при выборе результата или использовании уже подтверждённого в этом расчёте факта
  why_needed: Калькулятор не выбирает клиническую стратегию.
  changes:
  - dose_or_action
  unknown_allowed: true
  action_if_unknown: insufficient_data; request this specific necessary fact; no individual dose
  source_refs:
  - RU-AGO
  input_role: required_selected_result_operand_or_source_gate
  source_locator: §4.1–4.2 PDF с.1–2; §4.3–4.4 с.3–5; §4.5–4.6 с.5–6; §8–10 с.16
  missing_states:
  - unknown
  - not_assessed
  value_aliases:
    сохранить: keep
    повысить: increase
    снизить: decrease
    прекратить: stop
    действие не выбрано: not_chosen
    неизвестно: unknown
    не исследовано: not_assessed
    не помню: unknown
  required_for_individual_result: true
  condition_effect: missing -> insufficient_data; confirmed source exclusion -> not_applicable; source caution ->
    clinician_choice unless an explicit source-specific decision is present
  requirement_predicate:
    kind: always
  necessity_reason: Калькулятор не выбирает клиническую стратегию.
  fact_origin: patient_fact
clinical_parameters: []
logic:
  representation: conditional_source_rule
  conditions:
  - Применимость к указанному показанию/форме подтверждена в пределах дозового расчёта; это не полный клинический
    допуск.
  actions:
  - '§4.2 с.2: для прекращения самого агомелатина постепенное снижение не требуется.'
  - Это не разрешение следующего антидепрессанта в тот же день и не правило отмены других препаратов.
  parameter_refs: []
  source_refs:
  - RU-AGO
  - RU-GAD
  clinician_choices:
  - Необходимость изменения лечения и неоценённые модулем клинические обстоятельства.
  missing_data_behaviour: insufficient_data с конкретным отсутствующим полем, без безусловной дозы.
  unsupported_case_behaviour: Назвать неприменимую ветку; не переносить другую форму/показание.
  contraindicated_case_behaviour: Не выдавать схему противопоказанного сочетания, указать источник.
  conflicts: []
  composite_rule_dependencies: []
  combination_justification: КР определяет клиническую область, инструкция — дозовые параметры; новые коэффициенты
    не добавлены.
  result_contract_ref: remediation_round3/result_contracts.yaml#rules/ago-stop
  individual_output_gate: All required typed inputs and applicable conditional inputs must be known; evaluate every
    source-specific gate in result_contract. A caution has clinician_choice, not an invented coefficient. No blanket
    clinical clearance.
  input_necessity_policy_ref: remediation_round3/necessity_decisions.json#ago-stop
