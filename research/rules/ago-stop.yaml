schema_version: '1.0'
rule_id: ago-stop
development_status: extracted_research_not_executable
language: ru
identity:
  title: 'Агомелатин: прекращение без обязательного снижения дозы'
  mode: taper
  drug_inn: агомелатин
  from_drug_inn: null
  to_drug_inn: null
