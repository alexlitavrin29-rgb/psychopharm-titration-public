logic:
  representation: decision_table
  conditions:
  - Диагноз, препарат и режим выбрал врач. Соответствие популяции/форме и ограничения источника подтверждены.
  actions:
  - Информационный диапазон первого снижения = current_dose × (1 − initial_reduction/100); врачу оставляется выбор
    процента и интервала внутри опубликованных ориентиров.
  - 'Последующие шаги не фиксировать: повторно оценивать симптомы, при необходимости замедлить/приостановить. Сильная
    физическая зависимость и особые популяции требуют отдельного разбора implementation considerations с.46 и соответствующих
    разделов.'
  - Дозовая эквивалентность разных БЗД не вычисляется этой карточкой.
  parameter_refs:
  - initial_reduction
  - initial_interval
  - usual_rate_ceiling
  - adult_boundary
  source_refs:
  - US-ASAM
  clinician_choices:
  - Применимость при особых состояниях и взаимодействиях
  - Необходимость следующего условного шага
  missing_data_behaviour: Назвать обязательные неизвестные поля; результат insufficient_data. Справочные этапы можно
    показать как условные, без безусловной дозы пациенту.
  unsupported_case_behaviour: not_applicable для этой карточки; указать конкретную отсутствующую ветку, не запретить
    всё лечение.
  contraindicated_case_behaviour: Не выдавать дозовую схему противопоказанного сочетания; отобразить источник и
    причину.
  conflicts: []
  composite_rule_dependencies: []
  combination_justification: Самостоятельные поправки не перемножаются. Совпадение числа не подтверждает применимость
    их сочетания.
