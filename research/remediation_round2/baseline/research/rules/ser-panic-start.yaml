schema_version: '1.0'
rule_id: ser-panic-start
development_status: extracted_research_not_executable
language: ru
identity:
  title: 'Сертралин: старт при паническом расстройстве'
  mode: start
  drug_inn: сертралин
  from_drug_inn: null
  to_drug_inn: null
  formulation: 'Золофт: таблетки, покрытые плёночной оболочкой; 50/100 мг'
  route: oral
  diagnosis_label_ru: Паническое расстройство
  classification_system: МКБ-10
  diagnosis_code: F41.0
  jurisdiction: RU_versioned_copy
applicability:
  population_description: Взрослые. Только подтверждённые условия этой карточки; другие популяции не получают масштабированную
    взрослую дозу.
  age_constraints:
  - minimum: 18
    inclusive: true
    unit: year
    source_ref: RU-SER
    source_locator: §4.1, PDF с.1
  pregnancy: Решение по применимости/пользе и риску отдельно; без опубликованной числовой поправки. Стандартная
    карточка не выдаёт автоматическую дозу при беременности.
  lactation: Проверять отдельные ограничения источника. Стандартная карточка не выдаёт автоматическую дозу при кормлении.
  renal_constraints:
  - Коррекция при почечной недостаточности не требуется (§4.2, PDF с.2); CLcr не обязательный ввод.
  hepatic_constraints:
  - Нужна меньшая доза/кратность без точного числа; стандартная числовая ветка не применяется. При тяжёлом нарушении
    не применять (§4.2 с.2).
  comorbidity_constraints:
  - 'Мания/гипомания, судороги/неконтролируемая эпилепсия, суицидальный риск, акатизия, риск кровотечения, гипонатремии
    и удлинения QT: ограничения/наблюдение по инструкции; числовых множителей для них нет.'
  interacting_drugs:
  - 'ИМАО и пимозид: противопоказания/интервалы §4.3–4.5; прочие серотонинергические, влияющие на QT/кровотечения
    — отдельная проверка.'
  other_conditions: []
  exclusions:
  - Гиперчувствительность
  - Непроверенные противопоказания/взаимодействия не считать отсутствующими
  indication_status_in_russia: RU_indication_in_read_copy_registry_row_observed_latest_text_identity_not_asserted
  source_refs: &id003
  - RU-SER
