clinical_parameters:
- parameter_id: target_depression_start
  meaning: Справочная обычная стартовая суточная доза B при взрослой депрессии; не доза перехода
  value: 50
  lower: null
  upper: null
  lower_inclusive: null
  upper_inclusive: null
  unit: mg/day
  source_ref: RU-SER
  source_locator: §4.2, PDF с.2, депрессия
  source_meaning: предписание
  derivation: null
logic:
  representation: narrative_only
  conditions:
  - Показание и стратегию выбрал врач; ограничения источника проверяются отдельно.
  actions:
  - Учитывать постепенное прекращение A по российским источникам; точные ступени исходной дозы источник не задаёт.
  - Время начала B и возможность перекрытия не выводить из срока отмены A. Если точного российского правила нет,
    результат clinician_choice без календаря.
  - Зарубежный direct switch на следующий день исключён из профиля РФ. Российская начальная доза B сама по себе
    не определяет время перехода.
  parameter_refs:
  - target_depression_start
  source_refs:
  - RU-ESC
  - RU-SER
  - RU-DEP
  clinician_choices:
  - Размер и темп снижения A
  - Условия старта и доза B по его применимой инструкции
  - Время начала B; точная парная стратегия не завершена
  missing_data_behaviour: Назвать обязательные неизвестные поля; результат insufficient_data. Справочные этапы можно
    показать как условные, без безусловной дозы пациенту.
  unsupported_case_behaviour: not_applicable для этой карточки; указать конкретную отсутствующую ветку, не запретить
    всё лечение.
  contraindicated_case_behaviour: Не выдавать дозовую схему противопоказанного сочетания; отобразить источник и
    причину.
  conflicts:
  - Приоритет источника решён в пользу РФ; недостающий календарь остаётся пробелом, а не конфликтом выбора юрисдикции.
  composite_rule_dependencies: []
  combination_justification: Независимые правила не образуют автоматически полный клинический календарь.
  maoi_history_contract:
    source_ref: RU-SER
    source_locator: §4.3 с.3; §4.5 с.7–8
    locator: §4.3 с.3; §4.5 с.7–8
    irreversible_days: 14
    to_maoi_days: 7
    reversible: 'Источник допускает короче 14 дней, но не задаёт точный срок: clinician_choice без разрешения старта
      по числу.'
    concurrent:
    - irreversible_maoi
    - reversible_selective_maoi
    - reversible_nonselective_maoi
    - pimozide
    fields:
    - medicines
    - maoi_type
    - maoi_stopped_at
    reference_time: external_context.calculation_at
    required_timestamp_unknown: insufficient_data; missing maoi_stopped_at; start_allowed=false
    current_maoi: not_applicable for standard branch; no numeric start
    multiple_records: all applicable direction gates must be satisfied; no single last record shortcut
    calendar_day: next calendar date; not elapsed 24 hours unless that specific source says 24 hours
    scope: Medication-history applicability of the identified A source; not an A→AGO washout. B overlap is independently
      bound to RU-AGO §4.2.
  source_blocker:
    source_ref: RU-ESC
    medical_predicates_confirmed: false
    renal_boundary_operator: null
    hepatic_class_mapping: null
    action: source_unavailable; no individualized numeric or combined result
  result_contract_ref: remediation/result_contracts.yaml#rules/switch-esc-ser
  individual_output_gate: All required typed inputs and applicable conditional inputs must be known; evaluate every
    source-specific gate in result_contract. A caution has clinician_choice, not an invented coefficient. No blanket
    clinical clearance.
