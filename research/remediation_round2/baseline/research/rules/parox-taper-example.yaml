logic:
  representation: source_example
  conditions:
  - Показание/препарат выбраны врачом; взрослая применимость и форма подтверждены.
  actions:
  - Если врач выбрал пример, снижать суточную дозу на 10 мг через неделю до 20 мг; после 1 недели на 20 мг отменить.
  - При симптомах во время снижения/после отмены возможно возобновление прежней дозы и последующее более медленное
    снижение; точный более медленный шаг источник не задаёт.
  - 'Исходная доза <20, недостижимые формы, высокий риск/тяжелая отмена: пример не достраивать автоматически.'
  parameter_refs:
  - weekly_decrement
  - decrement_interval
  - last_source_dose
  - last_hold
  source_refs: *id001
  clinician_choices: &id004
  - Выбор применимости примера; необходимость более медленного снижения; прежняя переносимая доза при симптомах.
  missing_data_behaviour: Назвать обязательные неизвестные поля; результат insufficient_data. Справочные этапы можно
    показать как условные, без безусловной дозы пациенту.
  unsupported_case_behaviour: not_applicable для этой карточки; указать конкретную отсутствующую ветку, не запретить
    всё лечение.
  contraindicated_case_behaviour: Не выдавать дозовую схему противопоказанного сочетания; отобразить источник и
    причину.
  conflicts: []
  composite_rule_dependencies: []
  combination_justification: КР Б5 определяет риск/ведение отмены, ОХЛП задаёт отдельно маркированный взрослый пример.
    Детский пример §4.8 не используется.
  panic_discontinuation_context:
    source_ref: RU-PANIC
    source_locator: 456_3 §3.1 PDF с.31–32, приложение Б4
    course:
      minimum_months: 6
      comment_alternative_months: 12
      meaning: профилактика рецидива; сохранять достигнутую эффективную дозу
    discontinuation:
      gradual: true
      careful_observation: true
      source_minimum_phrase_months:
      - 2
      - 3
      taper_only_duration_months: null
      observation_only_duration_months: null
      interpretation: Фраза относится к постепенному снижению с тщательным контролем; источник не разделяет их длительности.
        Не строить собственный точный календарь.
    guideline_algorithm: 'Б4: профилактика/ведение СОПА; не график универсальных доз'
  result_contract_ref: remediation/result_contracts.yaml#rules/parox-taper-example
  individual_output_gate: All required typed inputs and applicable conditional inputs must be known; evaluate every
    source-specific gate in result_contract. A caution has clinician_choice, not an invented coefficient. No blanket
    clinical clearance.
