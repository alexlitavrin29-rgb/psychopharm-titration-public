applicability:
  population_description: Взрослые от 18 лет, паническое расстройство; пожилой/органный контекст разбирается отдельно.
  age_constraints:
  - minimum: 18
    inclusive: true
    unit: year
    source_ref: RU-PAROX
    source_locator: §4.1, PDF с.14
  pregnancy: Отдельная оценка применимости; дозовые коэффициенты не извлечены.
  lactation: Отдельная оценка применимости; дозовые коэффициенты не извлечены.
  renal_constraints: []
  hepatic_constraints: []
  comorbidity_constraints: []
  interacting_drugs:
  - Проверять текущие сочетания по ОХЛП; отмена не разрешает неподтверждённый переход на ИМАО.
  other_conditions:
  - Воспроизведение взрослого примера §4.2; не универсальный обязательный протокол.
  - Пример завершает снижение на 20 мг, держит 1 неделю и отменяет. Для исходной дозы ниже 20 мг полного расписания
    в этом примере нет.
  exclusions:
  - Возраст менее 18 лет; гиперчувствительность; противопоказанное сочетание по §4.3.
  indication_status_in_russia: RU_indication_present_in_original_registry_currency_separate
  source_refs: &id001
  - RU-PAROX
  - RU-DEP
  - RU-PANIC
