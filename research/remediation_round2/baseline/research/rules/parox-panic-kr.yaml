logic:
  representation: conditional_schedule
  conditions:
  - Показание/препарат выбраны врачом; взрослая применимость и форма подтверждены.
  actions:
  - Начало 10 мг один раз утром во время еды. По клиническому ответу повышение на 10 мг/сут не чаще одного раза
    в неделю до рекомендуемых 40 мг/сут.
  - Повышения выше 40 возможны при недостаточном ответе после нескольких недель на рекомендуемой дозе, до 60 мг/сут;
    термин «несколько недель» не заменять точным произвольным сроком.
  - У пожилых максимум 40 мг/сут; при тяжелой почечной/печеночной ветке не достраивать коэффициент.
  parameter_refs:
  - start
  - step
  - interval
  - therapeutic_range
  - recommended_dose
  - maximum
  - elderly_maximum
  - frequency
  - form_strength
  - allowed_half_dose
  source_refs: *id001
  clinician_choices: &id004
  - Необходимость каждого повышения по ответу/переносимости; несколько недель не превращать в фиксированное число.
  - Применимость особых популяций и взаимодействий.
  missing_data_behaviour: Назвать обязательные неизвестные поля; результат insufficient_data. Справочные этапы можно
    показать как условные, без безусловной дозы пациенту.
  unsupported_case_behaviour: not_applicable для этой карточки; указать конкретную отсутствующую ветку, не запретить
    всё лечение.
  contraindicated_case_behaviour: Не выдавать дозовую схему противопоказанного сочетания; отобразить источник и
    причину.
  conflicts: []
  composite_rule_dependencies: []
  combination_justification: 'Дозовые этапы КР сверены с конкретной российской ОХЛП: старт/шаг совпадают; дополнительное
    условие инструкции для >40 сохраняется.'
  maoi_history_contract:
    source_ref: RU-PAROX
    source_locator: §4.3 с.17–18
    locator: §4.3 с.17–18
    irreversible_days: 14
    reversible_hours: 24
    to_maoi_days: 7
    concurrent:
    - maoi
    - pimozide
    - thioridazine
    exception: Линезолид только исключительная клиническая ветка при отсутствии альтернатив, доступном наблюдении
      и оценке пользы/риска; обычный старт не разрешается.
    fields:
    - medicines
    - maoi_type
    - maoi_stopped_at
    reference_time: external_context.calculation_at
    required_timestamp_unknown: insufficient_data; missing maoi_stopped_at; start_allowed=false
    current_maoi: not_applicable for standard branch; no numeric start
    multiple_records: all applicable direction gates must be satisfied; no single last record shortcut
    calendar_day: next calendar date; not elapsed 24 hours unless that specific source says 24 hours
  result_contract_ref: remediation/result_contracts.yaml#rules/parox-panic-kr
  individual_output_gate: All required typed inputs and applicable conditional inputs must be known; evaluate every
    source-specific gate in result_contract. A caution has clinician_choice, not an invented coefficient. No blanket
    clinical clearance.
