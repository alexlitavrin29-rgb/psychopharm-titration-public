  mode: start
  drug_inn: дулоксетин
  from_drug_inn: null
  to_drug_inn: null
  formulation: Дулоксента, целые капсулы 60 мг
  route: oral
  diagnosis_label_ru: Депрессия / указанная коморбидность
  classification_system: МКБ-10
  diagnosis_code: F32/F33
  jurisdiction: RU_versioned_sources
applicability:
  population_description: Взрослые от 18 лет; показание и клиническое действие выбирает врач.
  age_constraints:
  - minimum: 18
    inclusive: true
    unit: year
    source_ref: RU-DULOX
    source_locator: §4.1–4.3 с.1–4; §4.4 с.5–9; §4.5 с.9–12; §4.6 с.12–13; §8–10 с.35
  pregnancy: Назначать только если потенциальная польза для матери значительно превышает риск для плода; §4.6 с.12.
    Автоматической дозовой поправки нет.
  lactation: Не рекомендуется кормление грудью во время терапии; §4.6 с.13. Отдельное решение врача, не коэффициент.
  renal_constraints:
  - 'КК 30–80 мл/мин: без поправки; <30 противопоказано, §4.2–4.3 с.3–4.'
  hepatic_constraints:
  - 'Заболевание печени с недостаточностью: не назначать §4.2–4.3.'
  comorbidity_constraints:
  - Неконтролируемая АГ, некомпенсированная закрытоугольная глаукома §4.3.
  interacting_drugs:
  - ИМАО; сильные CYP1A2 флувоксамин/ципрофлоксацин/эноксацин §4.3–4.5.
  other_conditions: []
  exclusions:
  - 'Сахароза: редкие наследственные непереносимость фруктозы, глюкозо-галактозная мальабсорбция, дефицит сахаразы-изомальтазы;
    §4.4 с.9.'
  indication_status_in_russia: RU_indication_in_read_original_latest_registry_text_separate
  source_refs: &id003
  - RU-DULOX
  - RU-DEP
