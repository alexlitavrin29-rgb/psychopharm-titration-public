logic:
  representation: narrative_only
  conditions:
  - Диагноз, препарат и режим выбрал врач. Соответствие популяции/форме и ограничения источника подтверждены.
  actions:
  - Постепенная отмена. Сохранить формулировку срока источника; точных ступеней до нуля нет.
  - Не создавать расписание −25/−50 мг или процент только из срока. Для длительного приёма/высокого риска КР предусматривает
    более медленную индивидуальную отмену без единого темпа.
  - При непереносимых симптомах после уменьшения или прекращения можно рассмотреть возобновление ранее назначенной
    дозы и последующее более медленное снижение (§4.2). Это решение врача, не обязательное действие.
  - Ни source_options_weeks, ни номинальный срок не ограничивают максимальную длительность; конкретный темп/пауза
    и возврат к прежней дозе остаются решениями врача по симптомам.
  parameter_refs:
  - reported_duration
  - adult_minimum
  - source_form_strengths
  source_refs: *id003
  clinician_choices:
  - Применимость при особых состояниях и взаимодействиях
  - Необходимость следующего условного шага
  missing_data_behaviour: Назвать обязательные неизвестные поля; результат insufficient_data. Справочные этапы можно
    показать как условные, без безусловной дозы пациенту.
  unsupported_case_behaviour: not_applicable для этой карточки; указать конкретную отсутствующую ветку, не запретить
    всё лечение.
  contraindicated_case_behaviour: Не выдавать дозовую схему противопоказанного сочетания; отобразить источник и
    причину.
  conflicts: []
  composite_rule_dependencies: []
  combination_justification: Самостоятельные поправки не перемножаются. Совпадение числа не подтверждает применимость
    их сочетания.
  panic_discontinuation_context:
    source_ref: RU-PANIC
    source_locator: 456_3 §3.1 PDF с.31–32, приложение Б4
    course:
      minimum_months: 6
      comment_alternative_months: 12
      meaning: профилактика рецидива; сохранять достигнутую эффективную дозу
    discontinuation:
      gradual: true
      careful_observation: true
      source_minimum_phrase_months:
      - 2
      - 3
      taper_only_duration_months: null
      observation_only_duration_months: null
      interpretation: Фраза относится к постепенному снижению с тщательным контролем; источник не разделяет их длительности.
        Не строить собственный точный календарь.
    guideline_algorithm: 'Б4: профилактика/ведение СОПА; не график универсальных доз'
  result_contract_ref: remediation/result_contracts.yaml#rules/ser-taper-limit
  individual_output_gate: All required typed inputs and applicable conditional inputs must be known; evaluate every
    source-specific gate in result_contract. A caution has clinician_choice, not an invented coefficient. No blanket
    clinical clearance.
