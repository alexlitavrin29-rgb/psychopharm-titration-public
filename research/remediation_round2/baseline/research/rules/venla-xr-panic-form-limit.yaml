  lactation: Лактация противопоказана, §4.3.
  renal_constraints:
  - 'Источник XR: абсолютная СКФ >30 мл/мин без коррекции; 10–30 снижение на 50%; <10 не рекомендуется/противопоказание.
    Нормированную eGFR не подставлять.'
  hepatic_constraints:
  - 'Лёгкая/умеренная: рассмотреть -50%; тяжёлая не рекомендуется; §4.3 ПВ >18 с. Не выводить категорию из одного
    анализа.'
  comorbidity_constraints: []
  interacting_drugs:
