schema_version: '1.0'
rule_id: switch-parox-ago-selected-example
development_status: extracted_research_not_executable
language: ru
identity:
  title: 'Пароксетин 40 мг → агомелатин: выбранный взрослый пример'
  mode: switch
  drug_inn: null
  from_drug_inn: пароксетин
  to_drug_inn: агомелатин
  formulation: &id004
    from: Рексетин, таблетки 20 мг; половина 10 мг
    to: Вальдоксан, таблетки 25 мг, покрытые пленочной оболочкой
  route: oral
  diagnosis_label_ru: Депрессивный эпизод/рекуррентная депрессия у взрослых
  classification_system: МКБ-10
  diagnosis_code: F32/F33
  jurisdiction: RU_versioned_sources
applicability:
  population_description: Взрослые с самостоятельным депрессивным расстройством; B не применять от 75 лет по ОХЛП.
  age_constraints:
  - minimum: 18
    inclusive: true
    unit: year
    source_ref: RU-AGO
    source_locator: §4.1–4.2, PDF с.1–2
  pregnancy: ОХЛП B рекомендует избегать назначения при беременности (§4.6 с.6); отдельное решение врача по A/B,
    без коэффициента.
  lactation: ОХЛП B требует решения прекратить вскармливание или терапию (§4.6 с.6); без коэффициента.
  renal_constraints:
  - При средней/тяжёлой почечной недостаточности опыт ограничен, соблюдать осторожность; §4.2 Вальдоксан с.2. Точной
    числовой поправки нет.
  hepatic_constraints:
  - B противопоказан при печеночной недостаточности и АЛТ/АСТ >3 ВГН. До начала печёночные пробы обязательны всем.
  comorbidity_constraints:
  - Мания/гипомания, суицидальный риск и факторы повреждения печени требуют отдельной клинической оценки/наблюдения;
    §4.4 с.3–5. Не числовые множители.
  interacting_drugs:
  - B противопоказан с флувоксамином/ципрофлоксацином (сильные CYP1A2-ингибиторы); проверять оба препарата, §4.3–4.5.
  other_conditions:
  - ОХЛП B прямо разрешает начало с 1-го дня постепенного снижения СИОЗС/СИОЗСН. Это классовое разрешение, применённое
    к явно указанному СИОЗС A; не исследование каждой пары.
  - Нет полного обязательного календаря доз A. Нужен выбор темпа врачом, а для пароксетина доступен отдельно маркированный
    взрослый пример.
  exclusions:
  - Печеночная недостаточность B; АЛТ или АСТ >3 ВГН; противопоказанный ингибитор CYP1A2; возрастная неприменимость;
    гиперчувствительность.
  - Редкие наследственные непереносимость галактозы, полная лактазная недостаточность, глюкозо-галактозная мальабсорбция
    (§4.3 с.3).
  - 'Пожилые с деменцией: не назначать (§4.4 с.4); не выводить категорию пожилых из самостоятельно выбранного возраста.'
  indication_status_in_russia: RU_indication_present_in_original_registry_currency_separate
  source_refs: &id003
  - RU-PAROX
  - RU-AGO
  - RU-DEP
