logic:
  representation: selected_conditional_source_example
  conditions:
  - Врач выбрал опубликованный взрослый пример отмены; исходная доза пароксетина именно 40 мг/сут, разрешённая форма
    подтверждена.
  - Показание БДР F32/F33, применимость агомелатина проверена отдельно, включая АЛТ и АСТ.
  - Нет тяжёлых симптомов/индивидуального основания замедлить этот пример; в противном случае календарь прекращает
    быть воспроизводимым этим модулем.
  actions:
  - 'День 1: пароксетин 30 мг/сут и агомелатин 25 мг перед сном.'
  - 'После недели на 30, день 8: пароксетин 20 мг/сут; агомелатин 25 мг перед сном.'
  - 'После недели на 20, день 15: прекратить пароксетин; агомелатин остаётся 25 мг до отдельного решения врача.'
  - Повышение B до 50 через 2 недели не автоматический этап этого примера. Симптомы отмены/неприменимость прекращают
    автоматический дальнейший календарь.
  - Сообщённая средняя/тяжёлая почечная недостаточность раскрывает отдельную ветку осторожности; не рассчитывать
    неизвестную числовую поправку и не считать неоценённое состояние нормой.
  parameter_refs:
  - target_start
  - target_frequency
  - start_taper_day
  - hepatic_cutoff
  - depression_age_exclusion
  - weekly_decrement
  - decrement_interval
  - last_source_dose
  - last_hold
  - repeat_liver_tests_hours
  - liver_monitoring_weeks
  source_refs: *id003
  clinician_choices: &id005
  - Индивидуальные ступени снижения A, оценка риска отмены и решение о начале B.
  - Применимость B и обязательный контроль печёночных проб.
  missing_data_behaviour: Назвать обязательные неизвестные поля; результат insufficient_data. Справочные этапы можно
    показать как условные, без безусловной дозы пациенту.
  unsupported_case_behaviour: not_applicable для этой карточки; указать конкретную отсутствующую ветку, не запретить
    всё лечение.
  contraindicated_case_behaviour: Не выдавать дозовую схему противопоказанного сочетания; отобразить источник и
    причину.
  conflicts: []
  composite_rule_dependencies:
  - parox-taper-example
  - ago-depression-start
  combination_justification: RU-AGO §4.2 с.2 прямо разрешает начало в первый день постепенного снижения СИОЗС/СИОЗСН
    и отсылает к инструкции A. RU-PAROX §4.2 с.16–17 даёт выбранный пример отмены. Это источниковая композиция,
    не испытанный парный протокол; opt-in только выбирает пример.
  maoi_history_contract:
    source_ref: RU-PAROX
    source_locator: §4.3 с.17–18
    locator: §4.3 с.17–18
    irreversible_days: 14
    reversible_hours: 24
    to_maoi_days: 7
    concurrent:
    - maoi
    - pimozide
    - thioridazine
    exception: Линезолид только исключительная клиническая ветка при отсутствии альтернатив, доступном наблюдении
      и оценке пользы/риска; обычный старт не разрешается.
    fields:
    - medicines
    - maoi_type
    - maoi_stopped_at
    reference_time: external_context.calculation_at
    required_timestamp_unknown: insufficient_data; missing maoi_stopped_at; start_allowed=false
    current_maoi: not_applicable for standard branch; no numeric start
    multiple_records: all applicable direction gates must be satisfied; no single last record shortcut
    calendar_day: next calendar date; not elapsed 24 hours unless that specific source says 24 hours
    scope: Medication-history applicability of the identified A source; not an A→AGO washout. B overlap is independently
      bound to RU-AGO §4.2.
  agomelatine_conditions:
  - id: hereditary_exclusion
    fields:
    - galactose_intolerance
    - complete_lactase_deficiency
    - glucose_galactose_malabsorption
    if: any true
    then: not_applicable; no start
    source_ref: RU-AGO
    source_locator: §4.3 с.3
  - id: elderly_dementia
    fields:
    - elderly_population
    - dementia
    if: both true
    then: not_applicable; no start
    source_ref: RU-AGO
    source_locator: §4.4 с.4
  - id: liver_stop
    fields:
    - liver_injury_signs
    - alt_ratio_uln
    - ast_ratio_uln
    if: liver_injury_signs true OR ALT > 3 OR AST > 3 during treatment
    then: stop agomelatine immediately; regular liver tests until normalization; no further numeric stage
    source_ref: RU-AGO
    source_locator: §4.4 с.4
  - id: repeat_liver_tests
    fields:
    - transaminases_rising
    if: 'true'
    then: repeat liver tests within repeat_liver_tests_hours; independently assess stop conditions
    source_ref: RU-AGO
    source_locator: §4.4 с.4
  - id: liver_risk_review
    fields:
    - overweight_obesity
    - fatty_liver
    - diabetes
    - alcohol_abuse
    - medicines
    if: risk factor present or hepatotoxic comedication
    then: clinician benefit/risk assessment before start; no dose coefficient
    source_ref: RU-AGO
    source_locator: §4.4 с.3
  - id: renal_caution
    fields:
    - renal_state
    if: средняя or тяжёлая
    then: clinician_choice; no new renal factor
    source_ref: RU-AGO
    source_locator: §4.2 с.2; §4.4 с.4
  - id: pregnancy_lactation
    fields:
    - pregnancy
    - lactation
    if: 'true'
    then: pregnancy avoid; lactation choose stopping breastfeeding or therapy; no standard automatic start
    source_ref: RU-AGO
    source_locator: §4.6 с.6
  - id: cyp1a2
    fields:
    - medicines
    if: strong CYP1A2 current
    then: not_applicable; moderate inhibitor -> clinician_choice; no PK-to-dose coefficient
    source_ref: RU-AGO
    source_locator: §4.3 с.3; §4.5 с.5–6
  - id: mania_stop
    fields:
    - mania_symptoms
    if: true during treatment
    then: stop agomelatine; source caution for history of mania/BAR is a separate mania field
    source_ref: RU-AGO
    source_locator: §4.4 с.4
  component_constraints:
    A: parox-taper-example and RU-PAROX §4.2–4.6
    B: ago-depression-start; all agomelatine_conditions mandatory
    baseline_scope: current_dose=40 mg/day; Reksetin 20 mg; normal assessed hepatic/renal categories; no current
      interacting contraindicated medicine
  result_contract_ref: remediation/result_contracts.yaml#rules/switch-parox-ago-selected-example
  individual_output_gate: All required typed inputs and applicable conditional inputs must be known; evaluate every
    source-specific gate in result_contract. A caution has clinician_choice, not an invented coefficient. No blanket
    clinical clearance.
