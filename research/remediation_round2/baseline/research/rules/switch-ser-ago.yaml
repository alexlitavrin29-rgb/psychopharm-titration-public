logic:
  representation: directed_switch_strategy
  conditions:
  - Показание/препарат выбраны врачом; взрослая применимость и форма подтверждены.
  actions:
  - A постепенно снижать по собственной инструкции и выбранному врачом плану.
  - 'B можно начать с первого дня снижения A: 25 мг однократно перед сном. Опубликовано разрешение перекрытия; ожидание
    последней дозы A не требуется этим способом перехода.'
  - 'Не вычислять универсальный washout из полувыведения. Не применять разрешение к флувоксамину: его сочетание
    с B противопоказано.'
  parameter_refs:
  - target_start
  - target_frequency
  - start_taper_day
  - hepatic_cutoff
  - depression_age_exclusion
  - repeat_liver_tests_hours
  - liver_monitoring_weeks
  source_refs: *id003
  clinician_choices: &id005
  - Индивидуальные ступени снижения A, оценка риска отмены и решение о начале B.
  - Применимость B и обязательный контроль печёночных проб.
  missing_data_behaviour: Назвать обязательные неизвестные поля; результат insufficient_data. Справочные этапы можно
    показать как условные, без безусловной дозы пациенту.
  unsupported_case_behaviour: not_applicable для этой карточки; указать конкретную отсутствующую ветку, не запретить
    всё лечение.
  contraindicated_case_behaviour: Не выдавать дозовую схему противопоказанного сочетания; отобразить источник и
    причину.
  conflicts: []
  composite_rule_dependencies:
  - ser-taper-limit
  combination_justification: Опубликованное правило B прямо отсылает к инструкции A. Классовое разрешение СИОЗС
    применяется к конкретной названной паре; точные дозы/темп A не выводятся из этого разрешения.
  maoi_history_contract:
    source_ref: RU-SER
    source_locator: §4.3 с.3; §4.5 с.7–8
    locator: §4.3 с.3; §4.5 с.7–8
    irreversible_days: 14
    to_maoi_days: 7
    reversible: 'Источник допускает короче 14 дней, но не задаёт точный срок: clinician_choice без разрешения старта
      по числу.'
    concurrent:
    - irreversible_maoi
    - reversible_selective_maoi
    - reversible_nonselective_maoi
    - pimozide
    fields:
    - medicines
    - maoi_type
    - maoi_stopped_at
    reference_time: external_context.calculation_at
    required_timestamp_unknown: insufficient_data; missing maoi_stopped_at; start_allowed=false
    current_maoi: not_applicable for standard branch; no numeric start
    multiple_records: all applicable direction gates must be satisfied; no single last record shortcut
    calendar_day: next calendar date; not elapsed 24 hours unless that specific source says 24 hours
    scope: Medication-history applicability of the identified A source; not an A→AGO washout. B overlap is independently
      bound to RU-AGO §4.2.
  agomelatine_conditions:
  - id: hereditary_exclusion
    fields:
    - galactose_intolerance
    - complete_lactase_deficiency
    - glucose_galactose_malabsorption
    if: any true
    then: not_applicable; no start
    source_ref: RU-AGO
    source_locator: §4.3 с.3
  - id: elderly_dementia
    fields:
    - elderly_population
    - dementia
    if: both true
    then: not_applicable; no start
    source_ref: RU-AGO
    source_locator: §4.4 с.4
  - id: liver_stop
    fields:
    - liver_injury_signs
    - alt_ratio_uln
    - ast_ratio_uln
    if: liver_injury_signs true OR ALT > 3 OR AST > 3 during treatment
    then: stop agomelatine immediately; regular liver tests until normalization; no further numeric stage
    source_ref: RU-AGO
    source_locator: §4.4 с.4
  - id: repeat_liver_tests
    fields:
    - transaminases_rising
    if: 'true'
    then: repeat liver tests within repeat_liver_tests_hours; independently assess stop conditions
    source_ref: RU-AGO
    source_locator: §4.4 с.4
  - id: liver_risk_review
    fields:
    - overweight_obesity
    - fatty_liver
    - diabetes
    - alcohol_abuse
    - medicines
    if: risk factor present or hepatotoxic comedication
    then: clinician benefit/risk assessment before start; no dose coefficient
    source_ref: RU-AGO
    source_locator: §4.4 с.3
  - id: renal_caution
    fields:
    - renal_state
    if: средняя or тяжёлая
    then: clinician_choice; no new renal factor
    source_ref: RU-AGO
    source_locator: §4.2 с.2; §4.4 с.4
  - id: pregnancy_lactation
    fields:
    - pregnancy
    - lactation
    if: 'true'
    then: pregnancy avoid; lactation choose stopping breastfeeding or therapy; no standard automatic start
    source_ref: RU-AGO
    source_locator: §4.6 с.6
  - id: cyp1a2
    fields:
    - medicines
    if: strong CYP1A2 current
    then: not_applicable; moderate inhibitor -> clinician_choice; no PK-to-dose coefficient
    source_ref: RU-AGO
    source_locator: §4.3 с.3; §4.5 с.5–6
  - id: mania_stop
    fields:
    - mania_symptoms
    if: true during treatment
    then: stop agomelatine; source caution for history of mania/BAR is a separate mania field
    source_ref: RU-AGO
    source_locator: §4.4 с.4
  result_contract_ref: remediation/result_contracts.yaml#rules/switch-ser-ago
  individual_output_gate: All required typed inputs and applicable conditional inputs must be known; evaluate every
    source-specific gate in result_contract. A caution has clinician_choice, not an invented coefficient. No blanket
    clinical clearance.
