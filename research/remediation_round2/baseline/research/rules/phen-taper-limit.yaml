clinical_parameters: []
logic:
  representation: conditional_source_rule
  conditions:
  - Применимость к указанному показанию/форме подтверждена в пределах дозового расчёта; это не полный клинический
    допуск.
  actions:
  - Дозу при отмене уменьшают постепенно (PDF с.3). Источник не задаёт числовой шаг/процент/период отмены.
  - Длительность курса 2 недели, иногда до 2 месяцев — не длительность снижения и не обязательный календарь.
  - При внезапной отмене возможен синдром отмены; зависимость/сложный случай требует отдельной клинической стратегии.
    ASAM остаётся сравнением.
  parameter_refs: []
  source_refs: *id002
  clinician_choices:
  - Необходимость изменения лечения и неоценённые модулем клинические обстоятельства.
  missing_data_behaviour: insufficient_data с конкретным отсутствующим полем, без безусловной дозы.
  unsupported_case_behaviour: Назвать неприменимую ветку; не переносить другую форму/показание.
  contraindicated_case_behaviour: Не выдавать схему противопоказанного сочетания, указать источник.
  conflicts: []
  composite_rule_dependencies: []
  combination_justification: КР определяет клиническую область, инструкция — дозовые параметры; новые коэффициенты
    не добавлены.
  result_contract_ref: remediation/result_contracts.yaml#rules/phen-taper-limit
  individual_output_gate: All required typed inputs and applicable conditional inputs must be known; evaluate every
    source-specific gate in result_contract. A caution has clinician_choice, not an invented coefficient. No blanket
    clinical clearance.
