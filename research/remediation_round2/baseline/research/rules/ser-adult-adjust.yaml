  unit: year
  allowed_values: []
  required_when: для индивидуального результата
  show_when: при выборе этой карточки
  why_needed: Возрастная применимость; для эсциталопрама особая пожилая ветка, для прегабалина возраст не заменяет
    CLcr.
  changes:
  - applicability
