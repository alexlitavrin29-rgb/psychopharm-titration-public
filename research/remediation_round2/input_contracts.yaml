conditional_history_fields:
  maoi_type: object keyed by relevant record_id; value in source-specific MAOI type enum
  maoi_stopped_at: object keyed by stopped MAOI record_id; ISO8601 with UTC offset; each timestamp counted separately
  empty_history: '[] confirms none; omit conditional fields; omission is not unknown because predicate is false'
  source_interval: evaluate every record; do not infer interval after A from B-to-A interval
fact_provenance:
  scope: only within this calculation; no patient history
  confirmed_patient_fact: explicit answer or supplied current source-specific assessment; action selection is not
    evidence
  derived_product_metadata: product/form/strength selection determines INN, release, registration and splitting
    from the identified edition
  unknown: retain verbatim missing state; never fabricate a prior assessment
requirement_predicates:
  always: Independent patient fact or identified form needed for the selected individual branch
  increase: Required only for clinician_action=increase or not_chosen; not for keeping an already selected dose
  action_choice: Required only when the psychiatrist has not selected an action
  reported_context: Collect if supplied or relevant context has been identified; otherwise keep not_assessed and
    show the source warning. Never infer false
