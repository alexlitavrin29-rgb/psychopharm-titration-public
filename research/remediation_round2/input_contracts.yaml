schema_version: '2.0'
nature: Research input contract; not executed calculator
missing_states:
  omitted: missing
  'null': missing
  unknown: known to be unknown
  not_assessed: not assessed; never normal
boolean_aliases:
  да: true
  нет: false
  неизвестно: unknown
  не исследовано: not_assessed
action_aliases:
  сохранить: keep
  повысить: increase
  снизить: decrease
  прекратить: stop
  действие не выбрано: not_chosen
units:
  week_to_day:
    factor: 7
    basis: calendar unit conversion, not a treatment interval
  CLcr: mL/min
  absolute_GFR: mL/min
  indexed_eGFR: mL/min/1.73m2
  automatic_renal_conversion: false
structures:
  structured_form:
    fields:
      product: string
      registration_number: string | null only if source prints no number; null does not confirm registration/currency
        or individualized form clearance
      source_id: string
      dosage_form: 'enum: tablet | capsule | orodispersible_tablet'
      strengths_mg: list[number]
      release: 'enum: immediate | enteric | prolonged'
      route: oral
      source_version: exact sources.json version string
    splitting: derived only from the identified source/form; never an unchecked physician checkbox
  medication_list:
    type: list
    entry_fields:
      inn: string
      status: current | stopped
      interaction_class: source-mapped class | unknown
      record_id: string; matches separate MAOI fields
      classification_basis: optional object {source_ref:string, source_locator:string}; provenance, unit=null, not
        an additional clinical question
    empty_list: confirmed none; unknown is not []
    timestamps: Separate fields maoi_type/maoi_stopped_at per relevant record; counted separately
  structured_renal:
    fields:
      metric: CLcr | absolute_GFR | indexed_eGFR
      value: number
      unit: string
      method: string | unknown
      assessment: known | unknown | not_assessed
    not_interchangeable: true
    implicit_normal_category_for_missing_value: false
  source_hepatic_category:
    fields:
      category: source-specific string
      assessment: known | unknown | not_assessed
      classification: source-specific classification | not_specified
      evidence: clinician supplied assessment
    no_inference_from_single_enzyme: true
  dose_schedule:
    fields:
      stages: list of day, total_daily_mg, frequency, proceed, hold, stop
      basis: source and locator | clinician choice
    unpublished_values: clinician choice, never engine defaults
  clinical_assessment:
    type: explicit clinician decision with source-specific category; not blanket safety clearance
  paired_allergy:
    fields:
      A: boolean | unknown | not_assessed
      B: boolean | unknown | not_assessed
    owner: A/B refer to identified from_form/to_form; two independently supplied facts, counted2; source refs per
      product
    derived_any: May derive any confirmed positive for exclusion; unknown member never becomes false
external_context:
  diagnosis:
    data_type: string
    unit: null
    origin: physician-selected diagnosis, no rediagnosis
  drug:
    data_type: string
    unit: null
    origin: physician-selected INN
    nullable_when: mode=switch only; from_drug and to_drug are required instead
  mode:
    data_type: enum
    unit: null
    allowed_values:
    - start
    - adjust
    - taper
    - switch
    - candidates
    origin: physician action
  from_drug:
    data_type: string
    unit: null
    origin: physician switch selection
  to_drug:
    data_type: string
    unit: null
    origin: physician switch selection
  requested_mg:
    data_type: number
    unit: mg
    origin: form feasibility fixture; not prescribed dose
  foreign_requested_strategy:
    data_type: string
    unit: null
    origin: negative routing fixture
  withdrawal_plan_duration_days:
    data_type: number
    unit: day
    origin: physician-supplied plan; not washout evidence
  usual_dose_mg_per_day:
    data_type: number
    unit: mg/day
    origin: arithmetic fixture base; bound to source start parameter
  unit:
    data_type: string
    unit: null
    origin: unit-validation fragment for renal operand
  eGFR:
    data_type: number
    unit: mL/min/1.73m2
    origin: negative fixture, cannot populate CLcr
  calculation_at:
    data_type: datetime
    unit: null
    origin: calculation context, ISO8601 with UTC offset; not clinician question
  treatment_phase:
    data_type: enum
    unit: null
    allowed_values:
    - ongoing
    - selected_mode
    origin: synthetic scenario context; distinguishes cessation from start clearance
  target_treatment_phase:
    origin: Explicit clinician-selected target treatment stage in current calculation; never inferred from global
      treatment_phase or from A dose
    question_policy: If not already supplied and needed to distinguish B cessation from B start prohibition, request/count
      as one separate complex-branch fact; no permanent patient history
    data_type: enum
    unit: null
    allowed_values:
    - not_started
    - ongoing
    - unknown
    - not_assessed
