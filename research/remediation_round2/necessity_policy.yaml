schema_version: '1.0'
nature: Authored primary-source interpretation for the selected result; not clinical validation
source: RU-SER
primary_file: source_downloads/Золофт — сертралин.pdf
result_scope: Execute a psychiatrist-selected dose action; check direct applicability and dose-changing conditions; retain unassessed monitoring context explicitly
definitions:
  always: Independent patient fact or identified form needed for the selected individual branch
  increase: Required only for clinician_action=increase or not_chosen; not for keeping an already selected dose
  action_choice: Required only when the psychiatrist has not selected an action
  reported_context: Collect if supplied or relevant context has been identified; otherwise keep not_assessed and show the source warning. Never infer false
ser_fields:
  age: {necessity: always, locator: '§4.4 с.5, дети; §4.1 с.1', effect: adult indication applicability}
  form: {necessity: always, locator: '§3 с.1; §4.2 с.2', effect: identified strength and equal halves of 50 mg tablet}
  pregnancy: {necessity: always, locator: '§4.6 с.10–11', effect: benefit/risk decision; action selection alone does not supply it}
  lactation: {necessity: always, locator: '§4.6 с.11', effect: source-specific clinical decision; action selection alone does not supply it}
  medicines: {necessity: always, locator: '§4.3 с.3; §4.5 с.7–11', effect: contraindicated combinations and each relevant MAOI interval}
  allergy: {necessity: always, locator: '§4.3 с.3', effect: contraindication; dose action does not establish absence}
  hepatic: {necessity: always, locator: '§4.2 с.2; §4.4 с.6', effect: lower dose/frequency unspecified or avoid severe impairment}
  mania: {necessity: reported_context, locator: '§4.4 с.4', effect: history requires caution/observation; active phase is a separate stop predicate}
  mania_symptoms: {necessity: always, locator: '§4.4 с.4', effect: active manic phase requires cessation of sertraline}
  seizure_state: {necessity: always, locator: '§4.4 с.4', effect: uncontrolled epilepsy avoids standard branch; new seizure requires cessation}
  current_dose: {necessity: always, locator: '§4.2 с.2–3', effect: dose arithmetic and maximum}
  time_at_dose: {necessity: increase, locator: '§4.2 с.2', effect: minimum interval before an increase; no new interval check for keep}
  response: {necessity: action_choice, locator: '§4.2 с.2', effect: needed for considering an action; not an extra gate after an explicit dose action}
  tolerability: {necessity: action_choice, locator: '§4.2 с.2; §4.4 с.6', effect: clinical choice of action; akathisia remains a separate increase gate}
  adherence: {necessity: action_choice, locator: 'КР ПР 456_3 §3.1 с.25–33', effect: clinical reassessment context; no numerical coefficient}
  qt_risk: {necessity: reported_context, locator: '§4.4 с.4', effect: caution if risk reported; no source mandate for routine ECG question before every selected action}
  bleeding_risk: {necessity: reported_context, locator: '§4.4 с.5', effect: caution/monitoring; medicine interaction remains a mandatory independent check}
  hyponatremia_risk: {necessity: reported_context, locator: '§4.4 с.5–6', effect: risk observation; symptomatic disease is a separate clinical cessation decision}
  suicide_risk: {necessity: reported_context, locator: '§4.4 с.4–5', effect: observation required generally and after dose changes; no numerical titration rule}
  akathisia: {necessity: increase, locator: '§4.4 с.6', effect: increasing dose may worsen symptoms; required before the increase branch}
  maoi_type: {necessity: maoi_record, locator: '§4.3 с.3; §4.5 с.7', effect: each relevant MAOI type independently determines applicability}
  maoi_stopped_at: {necessity: stopped_maoi_record, locator: '§4.3 с.3; §4.5 с.7', effect: each stopped MAOI timestamp independently determines interval}
taper_scope:
  statement: Start contraindications do not prevent cessation; preserve direct urgent-stop and withdrawal conditions
  ser_required: [age, form, current_dose, duration_of_use, prior_withdrawal, current_withdrawal, mania_symptoms, seizure_state]
  ser_locator: '§4.2 с.3; §4.4 с.4–6'
  preg_required: [age, form, current_dose, duration_of_use, prior_withdrawal, current_withdrawal, angioedema, severe_skin_reaction]
  preg_locator: 'RU-PREG §4.2 с.4; §4.4 с.6, немедленная отмена при ангиоотёке/тяжёлой кожной реакции'
review_limit: Other cards retain explicit conservative source-clear branch contracts. Their complete counts are not claimed to be a globally minimal questionnaire
