logic:
  representation: conditional_schedule
  conditions:
  - Показание/препарат выбраны врачом; взрослая применимость и форма подтверждены.
  actions:
  - Начало 10 мг один раз утром во время еды. По клиническому ответу повышение на 10 мг/сут не чаще одного раза
    в неделю до рекомендуемых 40 мг/сут.
  - Повышения выше 40 возможны при недостаточном ответе после нескольких недель на рекомендуемой дозе, до 60 мг/сут;
    термин «несколько недель» не заменять точным произвольным сроком.
  - У пожилых максимум 40 мг/сут; при тяжелой почечной/печеночной ветке не достраивать коэффициент.
  parameter_refs:
  - start
  - step
  - interval
  - therapeutic_range
  - recommended_dose
  - maximum
  - elderly_maximum
  - frequency
  - form_strength
  - allowed_half_dose
  source_refs:
  - RU-PANIC
  - RU-PAROX
  clinician_choices:
  - Необходимость каждого повышения по ответу/переносимости; несколько недель не превращать в фиксированное число.
  - Применимость особых популяций и взаимодействий.
  missing_data_behaviour: Назвать обязательные неизвестные поля; результат insufficient_data. Справочные этапы можно
    показать как условные, без безусловной дозы пациенту.
  unsupported_case_behaviour: not_applicable для этой карточки; указать конкретную отсутствующую ветку, не запретить
    всё лечение.
  contraindicated_case_behaviour: Не выдавать дозовую схему противопоказанного сочетания; отобразить источник и
    причину.
