development_status: extracted_research_not_executable
language: ru
identity:
  title: 'Пароксетин при паническом расстройстве: дозовые этапы российских КР'
  mode: start
  drug_inn: пароксетин
  from_drug_inn: null
  to_drug_inn: null
  formulation: Рексетин, таблетки 20 мг, покрытые пленочной оболочкой; деление пополам на 10 мг
  route: oral
  diagnosis_label_ru: Паническое расстройство
  classification_system: МКБ-10
  diagnosis_code: F41.0
  jurisdiction: RU_versioned_sources
applicability:
  population_description: Взрослые от 18 лет, паническое расстройство; пожилой/органный контекст разбирается отдельно.
  age_constraints:
  - minimum: 18
    inclusive: true
    unit: year
    source_ref: RU-PAROX
    source_locator: §4.1, PDF с.1
  pregnancy: Отдельная оценка применимости; дозовые коэффициенты не извлечены.
  lactation: Отдельная оценка применимости; дозовые коэффициенты не извлечены.
  renal_constraints:
  - При CLcr <30 мл/мин нижний край диапазона (§4.2 с.4); не делать автоматический коэффициент.
  hepatic_constraints:
  - При нарушении функции печени нижний край терапевтического диапазона; точная самостоятельная новая поправка не
    задана (§4.2 с.4).
  comorbidity_constraints: []
  interacting_drugs:
  - ИМАО, тиоридазин, пимозид — §4.3 с.4–5.
  other_conditions:
  - КР задаёт диапазон 40–60; инструкция отдельно выделяет рекомендуемые 40 и максимум 60 после недостаточного ответа
    через несколько недель на 40. Максимум не является целью.
  exclusions:
  - Возраст менее 18 лет; гиперчувствительность; противопоказанное сочетание по §4.3.
  indication_status_in_russia: RU_indication_present_in_original_registry_currency_separate
  source_refs:
  - RU-PANIC
  - RU-PAROX
