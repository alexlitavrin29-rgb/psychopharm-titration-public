    отсутствие текущего события. Возраст/событие — контекст при сообщении, counted; отсутствие/unknown явно unassessed.
    Известный симптом выбирает только своё опубликованное условие. Срочное источниковое действие требует фактического
    препарата и собственной подтверждённой фазы; справка не клинический допуск.
  fact_origin: patient_fact
