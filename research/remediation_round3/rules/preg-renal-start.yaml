logic:
  representation: decision_table
  conditions:
  - Диагноз, препарат и режим выбрал врач. Соответствие популяции/форме и ограничения источника подтверждены.
  - CLcr ≥0, числовой, подтверждён врачом; нет гемодиализа. Отрицательные значения/ошибки единиц не клиническая
    строка таблицы.
  actions:
  - clcr_lower: 60
    lower_inclusive: true
    clcr_upper: null
    start_ref: start_ge60
    max_ref: max_ge60
    frequency_ref: freq_ge30
  - clcr_lower: 30
    lower_inclusive: true
    clcr_upper: 60
    upper_inclusive: false
    start_ref: start_30_60
    max_ref: max_30_60
    frequency_ref: freq_ge30
  - clcr_lower: 15
    lower_inclusive: true
    clcr_upper: 30
    upper_inclusive: false
    start_ref: start_15_30
    max_ref: max_15_30
    frequency_ref: freq_15_30
  - clcr_lower: 0
    lower_inclusive: true
    clcr_upper: 15
    upper_inclusive: false
    start_ref: start_lt15
    max_ref: max_lt15
    frequency_ref: freq_lt15
  parameter_refs:
  - clcr_cutoffs
  - start_ge60
  - max_ge60
  - start_30_60
  - max_30_60
  - start_15_30
  - max_15_30
  - start_lt15
  - max_lt15
  - freq_ge30
  - freq_15_30
  - freq_lt15
  - adult_minimum
  - source_form_strengths
  source_refs:
  - RU-PREG
  clinician_choices:
  - Старт внутри опубликованного диапазона, если он дан
  - Кратность из допустимого перечня
  - Способ набора/перехода между начальной и максимальной дозой при нарушенной функции почек; точных недельных ступеней
    таблица не задаёт
  missing_data_behaviour: Назвать обязательные неизвестные поля; результат insufficient_data. Справочные этапы можно
    показать как условные, без безусловной дозы пациенту.
  unsupported_case_behaviour: not_applicable для этой карточки; указать конкретную отсутствующую ветку, не запретить
    всё лечение.
