  - Время начала B и возможность перекрытия не выводить из срока отмены A. Если точного российского правила нет,
    результат clinician_choice без календаря.
  - Зарубежный direct switch на следующий день исключён из профиля РФ. Российская начальная доза B сама по себе
    не определяет время перехода.
