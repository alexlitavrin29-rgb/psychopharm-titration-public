logic:
  representation: conditional_source_rule
  conditions:
  - Применимость к указанному показанию/форме подтверждена в пределах дозового расчёта; это не полный клинический
    допуск.
  actions:
  - 25 мг один раз перед сном. При отсутствии положительной динамики через 4 недели возможно 50 мг; решение врача
    по пользе/риску и строгий контроль печёночных проб.
  - 'Возрастная граница: ГТР строго старше 65; БДР 75 и старше — не применять. Эти условия не взаимозаменяемы.'
  - Перед стартом проверяются АЛТ и АСТ отдельно. >3 ВГН хотя бы одной пробы исключает начало; ровно 3 требует осторожности,
    не разрешение без прочих условий.
  - Сообщённая средняя/тяжёлая почечная недостаточность раскрывает отдельную ветку осторожности; не рассчитывать
    неизвестную числовую поправку и не считать неоценённое состояние нормой.
  parameter_refs:
  - start
  - frequency
  - conditional_higher_dose
  - earliest_higher_stage
  - age_limit
  - transaminase_limit
  - repeat_liver_tests_hours
  - liver_monitoring_weeks
  source_refs:
  - RU-AGO
  - RU-GAD
  clinician_choices:
  - Необходимость изменения лечения и неоценённые модулем клинические обстоятельства.
  missing_data_behaviour: insufficient_data с конкретным отсутствующим полем, без безусловной дозы.
  unsupported_case_behaviour: Назвать неприменимую ветку; не переносить другую форму/показание.
  contraindicated_case_behaviour: Не выдавать схему противопоказанного сочетания, указать источник.
  conflicts: []
  composite_rule_dependencies: []
  combination_justification: КР определяет клиническую область, инструкция — дозовые параметры; новые коэффициенты
    не добавлены.
  agomelatine_conditions:
  - id: hereditary_exclusion
    fields:
    - galactose_intolerance
    - complete_lactase_deficiency
    - glucose_galactose_malabsorption
    if: any true
    then: not_applicable; no start
    source_ref: RU-AGO
    source_locator: §4.3 с.3
  - id: elderly_dementia
    fields:
    - elderly_population
    - dementia
    if: both true
    then: not_applicable; no start
    source_ref: RU-AGO
    source_locator: §4.4 с.4
  - id: liver_stop
    fields:
    - liver_injury_signs
    - ALT_ratio
    - AST_ratio
    if: liver_injury_signs true OR ALT > 3 OR AST > 3 during treatment
    then: stop agomelatine immediately; regular liver tests until normalization; no further numeric stage
    source_ref: RU-AGO
    source_locator: §4.4 с.4
  - id: repeat_liver_tests
    fields:
    - transaminases_rising
    if: 'true'
    then: repeat liver tests within repeat_liver_tests_hours; independently assess stop conditions
    source_ref: RU-AGO
    source_locator: §4.4 с.4
  - id: liver_risk_review
    fields:
    - overweight_obesity
    - fatty_liver
    - diabetes
    - alcohol_abuse
    - medicines
    if: risk factor present or hepatotoxic comedication
    then: clinician benefit/risk assessment before start; no dose coefficient
    source_ref: RU-AGO
    source_locator: §4.4 с.3
  - id: renal_caution
    fields:
    - renal_state
    if: средняя or тяжёлая
    then: clinician_choice; no new renal factor
    source_ref: RU-AGO
    source_locator: §4.2 с.2; §4.4 с.4
  - id: pregnancy_lactation
    fields:
    - pregnancy
    - lactation
    if: 'true'
    then: pregnancy avoid; lactation choose stopping breastfeeding or therapy; no standard automatic start
    source_ref: RU-AGO
    source_locator: §4.6 с.6
  - id: cyp1a2
    fields:
    - medicines
    if: strong CYP1A2 current
    then: not_applicable; moderate inhibitor -> clinician_choice; no PK-to-dose coefficient
    source_ref: RU-AGO
    source_locator: §4.3 с.3; §4.5 с.5–6
  - id: mania_stop
    fields:
    - mania_symptoms
    if: true during treatment
    then: stop agomelatine; source caution for history of mania/BAR is a separate mania field
    source_ref: RU-AGO
    source_locator: §4.4 с.4
  result_contract_ref: remediation_round3/result_contracts.yaml#rules/ago-gad-start
  individual_output_gate: All required typed inputs and applicable conditional inputs must be known; evaluate every
