development_status: extracted_research_not_executable
language: ru
identity:
  title: 'Агомелатин: ГТР, старт и условное повышение'
  mode: start
  drug_inn: агомелатин
  from_drug_inn: null
  to_drug_inn: null
  formulation: Вальдоксан, целые таблетки 25 мг
  route: oral
  diagnosis_label_ru: ГТР
  classification_system: МКБ-10
  diagnosis_code: F41.1
  jurisdiction: RU_versioned_sources
applicability:
  population_description: Взрослые от 18 лет; показание и клиническое действие выбирает врач.
  age_constraints:
  - minimum: 18
    inclusive: true
    unit: year
    source_ref: RU-AGO
    source_locator: §4.1–4.2 PDF с.1–2; §4.3–4.4 с.3–5; §4.5–4.6 с.5–6; §8–10 с.16
  pregnancy: Рекомендуется избегать назначения во время беременности; §4.6 PDF с.6. Числовой поправки нет.
  lactation: Риск для ребёнка не исключён; врач выбирает прекращение грудного вскармливания либо приёма препарата,
    §4.6 с.6. Не числовой коэффициент.
  renal_constraints:
  - При средней/тяжёлой почечной недостаточности опыт ограничен, соблюдать осторожность; §4.2 Вальдоксан с.2. Точной
    числовой поправки нет.
  hepatic_constraints:
  - Печёночная недостаточность/активная болезнь; АЛТ или АСТ >3 ВГН — противопоказание. При 1–3 ВГН осторожность,
    не считать нормой.
  comorbidity_constraints:
  - Мания/гипомания, суицидальный риск и факторы повреждения печени требуют отдельной клинической оценки/наблюдения;
    §4.4 с.3–5. Не числовые множители.
  interacting_drugs:
  - Флувоксамин/ципрофлоксацин — сильные CYP1A2, противопоказаны.
  other_conditions:
  - Печёночные пробы всем до начала; контроль приблизительно 3/6/12/24 недели и после повышения. Это лабораторный
    мониторинг, не календарь визитов.
  exclusions:
  - Редкие наследственные непереносимость галактозы, полная лактазная недостаточность, глюкозо-галактозная мальабсорбция
    (§4.3 с.3).
  - 'Пожилые с деменцией: не назначать (§4.4 с.4); не выводить категорию пожилых из самостоятельно выбранного возраста.'
  indication_status_in_russia: RU_indication_in_read_original_latest_registry_text_separate
  source_refs:
  - RU-AGO
  - RU-GAD
