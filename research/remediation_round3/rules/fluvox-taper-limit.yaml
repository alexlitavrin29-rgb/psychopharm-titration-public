schema_version: '1.0'
rule_id: fluvox-taper-limit
development_status: extracted_research_not_executable
language: ru
identity:
  title: 'флувоксамин: ограничения отмены'
  mode: taper
  drug_inn: флувоксамин
  from_drug_inn: null
  to_drug_inn: null
  formulation: Феварин 50/100 мг; разрешены две равные половины (§3 с.1; §4.2 с.3 текущей ОХЛП)
  route: oral
  diagnosis_label_ru: Депрессия / указанная коморбидность
  classification_system: МКБ-10
  diagnosis_code: F32/F33
  jurisdiction: RU_versioned_sources
applicability:
  population_description: Взрослые от 18 лет; показание и клиническое действие выбирает врач.
  age_constraints:
  - minimum: 18
    inclusive: true
    unit: year
    source_ref: RU-FLUVOX
    source_locator: §4.1–4.3 PDF с.1–3; §4.4–4.6 с.4–11; §8–10 с.19
  pregnancy: Не рекомендуется при беременности, кроме клинической необходимости по решению врача; §4.6 с.10. Числовой
    поправки нет.
  lactation: Не должен применяться в период грудного вскармливания; §4.6 с.10. Стандартный старт не выдаётся автоматически.
  renal_constraints:
  - При почечной недостаточности начинать с низких доз под строгим врачебным контролем; §4.2 с.3. Точный коэффициент/число
    не задан.
  hepatic_constraints:
  - При печёночной недостаточности начинать с низких доз под строгим врачебным контролем; §4.2 с.3. Не предвыбирать
    50 как доказанную органную поправку.
  comorbidity_constraints: []
  interacting_drugs: []
  other_conditions: []
  exclusions: []
  indication_status_in_russia: RU_indication_in_read_original_latest_registry_text_separate
  source_refs:
  - RU-FLUVOX
  - RU-DEP
