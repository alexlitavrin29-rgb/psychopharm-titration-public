    расстройству, когда выбирается клиническое действие. RU-PHOB физ.с.29 описывает инструмент оценки и не задаёт
    ту же обязательную предпосылку для F40.1. Для F40.1 сообщённые сведения сохраняются, отсутствие/unknown — not_assessed.
    Без выбранного действия повышение не выполняется; коэффициент приверженности отсутствует.'
  changes:
  - applicability
  unknown_allowed: true
  action_if_unknown: Named unassessed context; no normality or clinical clearance inferred
