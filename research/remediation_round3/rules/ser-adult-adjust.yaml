logic:
  representation: schedule
  conditions:
  - Врач выбрал диагноз, препарат, режим и конкретное действие; числовые условия проверяются по возрасту, форме,
    печени, текущей дозе и сроку. Это не универсальное подтверждение клинического допуска.
  - 'Начальный этап25мг не является обычным шагом+50: при выбранном повышении и выполненных источниковых условиях
    после не менее недели допустим опубликованный первый переход25→50мг/сут (RU-SER §4.2 с.2–3). Это отдельно от
    дальнейших шагов+50 и не безусловный будущий этап.'
  - Если врач выбрал повышение, вычислить только опубликованный шаг/интервал/предел. Если действие не выбрано, ответ/переносимость/приём
    разбираются отдельными полями; неизвестность не разрешает повышение.
  actions:
  - 'clinician_action=keep: сохранить current_dose; increase: проверить опубликованный шаг/минимальный срок/предел;
    decrease: точного меньшего шага здесь нет, clinician_choice; unknown/not_chosen: без автоматического изменения.'
  - Для отдельного первого шага25→50 применять опубликованный режим/минимум недели по RU-SER §4.2 с.2–3. Для последующих
    подходящих доз вариант=current_dose+step только при выполнении интервала/предела; при превышении максимума не
    округлять до него как произвольной ступени. Врач выбирает дальнейшую тактику.
  - При достаточном эффекте повышение не требуется; при неприемлемой переносимости точная меньшая доза здесь не
    задана.
  - Если врач указал дозовое действие напрямую, проверить опубликованные дозу/интервал/предел; не превращать этот
    выбор в отметку отсутствия всех рисков. При отсутствии выбранного действия использовать отдельные ответ/переносимость/фактический
    приём.
  parameter_refs:
  - step
  - interval
  - maximum
  - first_standard_dose
  - frequency
  - adult_minimum
  - source_form_strengths
  source_refs:
  - RU-SER
  clinician_choices:
  - Применимость при особых состояниях и взаимодействиях
  - Необходимость следующего условного шага
  missing_data_behaviour: Назвать обязательные неизвестные поля; результат insufficient_data. Справочные этапы можно
    показать как условные, без безусловной дозы пациенту.
  unsupported_case_behaviour: not_applicable для этой карточки; указать конкретную отсутствующую ветку, не запретить
    всё лечение.
  contraindicated_case_behaviour: Не выдавать дозовую схему противопоказанного сочетания; отобразить источник и
    причину.
  conflicts: []
  composite_rule_dependencies: []
  combination_justification: Самостоятельные поправки не перемножаются. Совпадение числа не подтверждает применимость
    их сочетания.
  maoi_history_contract:
    source_ref: RU-SER
    source_locator: §4.3 с.3; §4.5 с.7–8
    locator: §4.3 с.3; §4.5 с.7–8
    irreversible_days: 14
    to_maoi_days: 7
    reversible: 'Источник допускает короче 14 дней, но не задаёт точный срок: clinician_choice без разрешения старта
      по числу.'
    concurrent:
    - irreversible_maoi
    - reversible_selective_maoi
    - reversible_nonselective_maoi
    - pimozide
    fields:
    - medicines
    - maoi_type
    - maoi_stopped_at
    reference_time: external_context.calculation_at
    required_timestamp_unknown: insufficient_data; missing maoi_stopped_at; start_allowed=false
    current_maoi: not_applicable for standard branch; no numeric start
    multiple_records: all applicable direction gates must be satisfied; no single last record shortcut
    calendar_day: next calendar date; not elapsed 24 hours unless that specific source says 24 hours
  result_contract_ref: remediation_round3/result_contracts.yaml#rules/ser-adult-adjust
  individual_output_gate: All required typed inputs and applicable conditional inputs must be known; evaluate every
    source-specific gate in result_contract. A caution has clinician_choice, not an invented coefficient. No blanket
    clinical clearance.
  input_necessity_policy_ref: remediation_round3/necessity_decisions.json#ser-adult-adjust
