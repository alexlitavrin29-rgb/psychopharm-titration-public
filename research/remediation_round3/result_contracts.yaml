      mania_symptoms:
        kind: ongoing_selected_drug
      suicide_risk:
        kind: reported_context
      ect:
        kind: reported_context
    unassessed_context_policy: Explicit not_assessed + source warning; never a negative answer or full clinical
      clearance
    monitoring_context_fields:
    - alcohol_use
    - mania
    - suicide_risk
    - ect
    - renal_state
    round3_necessity_scope: Selected source dose/action; not full clinical admission. Explicit phase predicates
      and unassessed context retained.
    selected_phase_policy:
      current_use_evidence: Explicit treatment_phase=ongoing, or active consumed actually_taken_current_daily_dose
        with a known positive value
      selected_mode: Selection only; start means first administration, other desired actions do not establish current
        use
      explicit_unknown_or_not_started: Overrides a derived current-dose phase; conflicting facts require physician
        clarification, no cessation source action
      qualitative_without_consumed_current_dose: Separate phase required only for a current-treatment source action;
        every supplied phase fact is counted
    bounded_source_action_input_policy: Individual numeric required_inputs do not delay a known source-specific
      current-treatment cessation. Only declared source cause, actual source identity and ongoing actor phase are
      prerequisites; supplied context remains counted. Prepared source-action specifications do not execute a medical
      engine.
