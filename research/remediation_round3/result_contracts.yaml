        field: elderly_population
      galactose_intolerance:
        kind: always
      complete_lactase_deficiency:
        kind: always
      glucose_galactose_malabsorption:
        kind: always
      liver_injury_signs:
        kind: ongoing_selected_drug
      transaminases_rising:
        kind: ongoing_selected_drug
      overweight_obesity:
        kind: always
      fatty_liver:
        kind: always
      diabetes:
        kind: always
      alcohol_abuse:
        kind: always
      alcohol_use:
        kind: reported_context
      mania:
