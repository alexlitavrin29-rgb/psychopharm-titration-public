    - sucrase_isomaltase_deficiency
    - akathisia
    - mania
    - suicide_risk
    - bleeding_risk
    - hyponatremia_risk
    - diabetes
    - seizure_state
    conditional_inputs:
      maoi_type: medicines contains current/stopped MAOI or unidentified interaction class
      maoi_stopped_at: medicines contains stopped MAOI; per relevant record
    source_gates:
    - source_ref: RU-DULOX
      version: Пересмотр 18.07.2024, §10 с.35; первая регистрация 02.04.2021
      locator: §4.1–4.3 с.2–4; §4.4–4.6 с.4–14
      exclusions: &id006
      - allergy
      - uncontrolled_hypertension
      - closed_angle_glaucoma
      - fructose_intolerance
      - glucose_galactose_malabsorption
      - sucrase_isomaltase_deficiency
      cautions: &id007
      - pregnancy
      - lactation
      - akathisia
      - mania
      - suicide_risk
      - bleeding_risk
      - hyponatremia_risk
      - diabetes
      current_medicines_excluded: &id008
      - maoi
      - strong_CYP1A2
      current_medicines_caution: &id009
      - serotonergic
      - bleeding
      - CYP2D6_inhibitor
      other: <18 exclude; CLcr <30 exclude; hepatic disease with insufficiency exclude; akathisia increase harmful;
        no joint elderly+depression dose
    gate_order:
    - unavailable_source
    - known immediate stop/exclusion
    - invalid/missing applicable field
    - unresolved source caution/modifier
    - dose branch
    reference_display: Source scheme only, without individualized dose; no omitted field treated as negative
    branches:
    - branch_id: usual
      when: all source gates clear; BDR
      expected_output:
        result_type: exact
        total_daily_dose_mg: 60
        dose_per_administration_mg: 60.0
        administrations_per_day: 1
        schedule: []
        missing_fields: []
        unconditional_future_stages: false
        automatic_escalation_to_120: false
      source_basis:
      - source_id: RU-DULOX
        version: Пересмотр 18.07.2024, §10 с.35; первая регистрация 02.04.2021
        locator: §4.1–4.3 с.1–4; §4.4 с.5–9; §4.5 с.9–12; §4.6 с.12–13; §8–10 с.35
        sha256: bcb5a8b9415f15fdae2ec8a8d00abe5788194c59893b6172294c4cf3db839786
      - source_id: RU-DEP
        version: '2024; каталог: опубликовано 26.08.2024, применяется'
        locator: §3.1–3.4 PDF с.24–40; таблица2 с.95–96; §3.6 с.45; Б5 с.105–106
        sha256: 2e8b83978be0e5fa3772e1dc37b44954bc5991fb4f74433ffd1375700ab7b5bd
    source_gate_scope: start/adjust applicability; both identified products for switch
    typed_source_conditions:
    - input: hepatic
      operator: category_equals
      value: liver_disease_with_insufficiency
