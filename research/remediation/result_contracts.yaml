schema_version: '2.0'
nature: Source-bound research expectations; no calculator implementation
rules:
  ago-depression-start:
    required_inputs:
    - age
    - form
    - hepatic
    - pregnancy
    - lactation
    - medicines
    - allergy
    - ALT_ratio
    - AST_ratio
    - renal_state
    - elderly_population
    - dementia
    - galactose_intolerance
    - complete_lactase_deficiency
    - glucose_galactose_malabsorption
    - liver_injury_signs
    - transaminases_rising
    - overweight_obesity
    - fatty_liver
    - diabetes
    - alcohol_abuse
    - alcohol_use
    - mania
    - mania_symptoms
    - suicide_risk
    - ect
    conditional_inputs: {}
    source_gates:
    - source_ref: RU-AGO
      version: Копия производителя с именем 20241228; первичная регистрация 25.01.2022; поле пересмотра пустое
      locator: §4.1–4.4 с.1–5; §4.5–4.6 с.5–6
      exclusions: &id001
      - allergy
      - galactose_intolerance
      - complete_lactase_deficiency
      - glucose_galactose_malabsorption
      cautions: &id002
      - pregnancy
      - lactation
      - mania
      - suicide_risk
      - overweight_obesity
      - fatty_liver
      - diabetes
      - alcohol_abuse
      - alcohol_use
      - ect
      current_medicines_excluded: &id003
      - strong_CYP1A2
      current_medicines_caution: &id004
      - moderate_CYP1A2
      - hepatotoxic
      stop: &id005
      - liver_injury_signs
      - mania_symptoms
      other: ALT and AST separately >3 exclude start; (1,3] caution; liver insufficiency/cirrhosis/active disease
        exclude; elderly+dementia exclude; GAD >65, BDR >=75 exclude; <18 exclude; moderate/severe renal caution;
        rising transaminases repeat within 48 hours
    gate_order:
    - unavailable_source
    - known immediate stop/exclusion
    - invalid/missing applicable field
    - unresolved source caution/modifier
    - dose branch
    reference_display: Source scheme only, without individualized dose; no omitted field treated as negative
    branches:
    - branch_id: usual
      when: all gates clear; assessed liver normal; ALT<=1 AND AST<=1; adult within indication-specific age
      expected_output:
        result_type: exact
        total_daily_dose_mg: 25
        dose_per_administration_mg: 25.0
        administrations_per_day: 1
        schedule: []
        missing_fields: []
        unconditional_future_stages: false
        monitoring:
          before_start: true
          approximate_weeks_parameter: liver_monitoring_weeks
          restart_same_frequency_after_dose_increase: true
          rising_repeat_hours_parameter: repeat_liver_tests_hours
          stop_signs_action: immediate cessation; tests until normal
          source_ref: RU-AGO
          source_locator: §4.2 с.1; §4.4 с.3–4
        conditional_higher_dose_mg: 50
        earliest_higher_weeks: 2
        higher_requires: no positive dynamics + clinician benefit/risk decision + liver monitoring
      source_basis:
      - source_id: RU-AGO
        version: Копия производителя с именем 20241228; первичная регистрация 25.01.2022; поле пересмотра пустое
        locator: §4.1–4.2 PDF с.1–2; §4.3–4.4 с.3–5; §4.5–4.6 с.5–6; §8–10 с.16
        sha256: 1cf8e71b5c27891e17b5b7ab4dd7c8c02697a1d44bb287a57a1ee9de0fb85bd6
      - source_id: RU-DEP
        version: '2024; каталог: опубликовано 26.08.2024, применяется'
        locator: §3.1–3.4 PDF с.24–40; таблица2 с.95–96; §3.6 с.45; Б5 с.105–106
        sha256: 2e8b83978be0e5fa3772e1dc37b44954bc5991fb4f74433ffd1375700ab7b5bd
    - branch_id: liver_caution
      when: ALT or AST >1 and <=3; no exclusion
      expected_output:
        result_type: clinician_choice
        total_daily_dose_mg: null
        dose_per_administration_mg: null
        administrations_per_day: null
        schedule: []
        missing_fields: []
        unconditional_future_stages: false
        monitoring:
          before_start: true
          approximate_weeks_parameter: liver_monitoring_weeks
          restart_same_frequency_after_dose_increase: true
          rising_repeat_hours_parameter: repeat_liver_tests_hours
          stop_signs_action: immediate cessation; tests until normal
          source_ref: RU-AGO
          source_locator: §4.2 с.1; §4.4 с.3–4
      source_basis:
      - source_id: RU-AGO
        version: Копия производителя с именем 20241228; первичная регистрация 25.01.2022; поле пересмотра пустое
        locator: §4.1–4.2 PDF с.1–2; §4.3–4.4 с.3–5; §4.5–4.6 с.5–6; §8–10 с.16
        sha256: 1cf8e71b5c27891e17b5b7ab4dd7c8c02697a1d44bb287a57a1ee9de0fb85bd6
      - source_id: RU-DEP
        version: '2024; каталог: опубликовано 26.08.2024, применяется'
        locator: §3.1–3.4 PDF с.24–40; таблица2 с.95–96; §3.6 с.45; Б5 с.105–106
        sha256: 2e8b83978be0e5fa3772e1dc37b44954bc5991fb4f74433ffd1375700ab7b5bd
    - branch_id: renal_caution
      when: moderate/severe renal impairment
      expected_output:
        result_type: clinician_choice
        total_daily_dose_mg: null
        dose_per_administration_mg: null
        administrations_per_day: null
        schedule: []
        missing_fields: []
        unconditional_future_stages: false
        dose_coefficient: null
      source_basis:
      - source_id: RU-AGO
        version: Копия производителя с именем 20241228; первичная регистрация 25.01.2022; поле пересмотра пустое
        locator: §4.1–4.2 PDF с.1–2; §4.3–4.4 с.3–5; §4.5–4.6 с.5–6; §8–10 с.16
        sha256: 1cf8e71b5c27891e17b5b7ab4dd7c8c02697a1d44bb287a57a1ee9de0fb85bd6
      - source_id: RU-DEP
        version: '2024; каталог: опубликовано 26.08.2024, применяется'
        locator: §3.1–3.4 PDF с.24–40; таблица2 с.95–96; §3.6 с.45; Б5 с.105–106
        sha256: 2e8b83978be0e5fa3772e1dc37b44954bc5991fb4f74433ffd1375700ab7b5bd
    - branch_id: repeat_tests
      when: rising transaminases; ALT and AST still <=3; no injury signs
      expected_output:
        result_type: clinician_choice
        total_daily_dose_mg: null
        dose_per_administration_mg: null
        administrations_per_day: null
        schedule: []
        missing_fields: []
        unconditional_future_stages: false
        repeat_tests_within_hours: 48
      source_basis:
      - source_id: RU-AGO
        version: Копия производителя с именем 20241228; первичная регистрация 25.01.2022; поле пересмотра пустое
        locator: §4.1–4.2 PDF с.1–2; §4.3–4.4 с.3–5; §4.5–4.6 с.5–6; §8–10 с.16
        sha256: 1cf8e71b5c27891e17b5b7ab4dd7c8c02697a1d44bb287a57a1ee9de0fb85bd6
      - source_id: RU-DEP
        version: '2024; каталог: опубликовано 26.08.2024, применяется'
        locator: §3.1–3.4 PDF с.24–40; таблица2 с.95–96; §3.6 с.45; Б5 с.105–106
        sha256: 2e8b83978be0e5fa3772e1dc37b44954bc5991fb4f74433ffd1375700ab7b5bd
    source_gate_scope: start/adjust applicability; both identified products for switch
    typed_source_conditions:
    - input: hepatic
      operator: category_equals
      value: hepatic_insufficiency
      action: not_applicable_standard_numeric_branch
      source_ref: RU-AGO
      source_locator: §4.1–4.2 PDF с.1–2; §4.3–4.4 с.3–5; §4.5–4.6 с.5–6; §8–10 с.16
    - input: hepatic
      operator: category_equals
      value: cirrhosis
      action: not_applicable_standard_numeric_branch
      source_ref: RU-AGO
      source_locator: §4.1–4.2 PDF с.1–2; §4.3–4.4 с.3–5; §4.5–4.6 с.5–6; §8–10 с.16
    - input: hepatic
      operator: category_equals
      value: active_liver_disease
      action: not_applicable_standard_numeric_branch
      source_ref: RU-AGO
      source_locator: §4.1–4.2 PDF с.1–2; §4.3–4.4 с.3–5; §4.5–4.6 с.5–6; §8–10 с.16
    ongoing_stop_conditions:
    - input: ALT_ratio
      operator: '>'
      value: 3
      unit: ULN ratio
      treatment_phase: ongoing
      action: source_stop_action
      stop_medication: RU-AGO
      followup: liver tests regularly until normalization
      source_ref: RU-AGO
      source_locator: §4.4 с.4, немедленное прекращение при АЛТ или АСТ >3 ВГН
    - input: AST_ratio
      operator: '>'
      value: 3
      unit: ULN ratio
      treatment_phase: ongoing
      action: source_stop_action
      stop_medication: RU-AGO
      followup: liver tests regularly until normalization
