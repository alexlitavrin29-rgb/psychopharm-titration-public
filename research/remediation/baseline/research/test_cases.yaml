case_conventions:
  scope: source_parameter_and_constraint_fragments
  unlisted_inputs: not_assessed_by_fragment; no default normal/no values
  positive_numeric_expectations: Conditional published parameter under the applicability/logic of its
    rule, not an unconditional patient prescription. Complete end-to-end input fixtures must be assembled
    when the calculator is implemented.
  negative_expectations: The given explicit contraindication/missing operand is sufficient for the stated
    refusal; omitted values never imply normality.
