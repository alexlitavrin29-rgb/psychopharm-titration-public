clinical_parameters:
- parameter_id: target_depression_start
  meaning: Справочная обычная стартовая суточная доза B при взрослой депрессии; не доза перехода
  value: 10
  lower: null
  upper: null
  lower_inclusive: null
  upper_inclusive: null
  unit: mg/day
  source_ref: RU-ESC
  source_locator: §4.2 PDF с.2, депрессивные эпизоды, ОХЛП 05.11.2025
  source_meaning: предписание
  derivation: null
logic:
  representation: narrative_only
  conditions:
  - Показание и стратегию выбрал врач; ограничения источника проверяются отдельно.
  actions:
  - Учитывать постепенное прекращение A по российским источникам; точные ступени исходной дозы источник
    не задаёт.
  - Время начала B и возможность перекрытия не выводить из срока отмены A. Если точного российского правила
    нет, результат clinician_choice без календаря.
  - Зарубежный direct switch на следующий день исключён из профиля РФ. Российская начальная доза B сама
    по себе не определяет время перехода.
  parameter_refs:
  - target_depression_start
  source_refs:
  - RU-SER
  - RU-ESC
  - RU-DEP
  clinician_choices:
  - Размер и темп снижения A
  - Условия старта и доза B по его применимой инструкции
  - Время начала B; точная парная стратегия не завершена
  missing_data_behaviour: Назвать обязательные неизвестные поля; результат insufficient_data. Справочные
    этапы можно показать как условные, без безусловной дозы пациенту.
  unsupported_case_behaviour: not_applicable для этой карточки; указать конкретную отсутствующую ветку,
    не запретить всё лечение.
  contraindicated_case_behaviour: Не выдавать дозовую схему противопоказанного сочетания; отобразить источник
    и причину.
  conflicts:
  - Приоритет источника решён в пользу РФ; недостающий календарь остаётся пробелом, а не конфликтом выбора
    юрисдикции.
  composite_rule_dependencies: []
  combination_justification: Независимые правила не образуют автоматически полный клинический календарь.
