schema_version: '1.0'
rule_id: esc-elderly-start
development_status: extracted_research_not_executable
language: ru
identity:
  title: 'Эсциталопрам при ГТР: Пожилой возраст'
  mode: start
  drug_inn: эсциталопрам
  from_drug_inn: null
  to_drug_inn: null
  formulation: 'Селектра: таблетки, покрытые плёночной оболочкой; 5/10/15/20 мг; 10/15/20 делятся на равные
    дозы (§3 с.1–2)'
  route: oral
  diagnosis_label_ru: Генерализованное тревожное расстройство
  classification_system: МКБ-10
  diagnosis_code: F41.1
  jurisdiction: RU_registry_original_2025-11-05
applicability:
  population_description: Взрослые. Только подтверждённые условия этой карточки; другие популяции не получают
    масштабированную взрослую дозу.
  age_constraints:
  - minimum: 18
    inclusive: true
    unit: year
    source_ref: RU-ESC
    source_locator: §4.1 с.2; §4.2 с.3
  pregnancy: Решение по применимости/пользе и риску отдельно; без опубликованной числовой поправки. Стандартная
    карточка не выдаёт автоматическую дозу при беременности.
  lactation: Проверять отдельные ограничения источника. Стандартная карточка не выдаёт автоматическую
    дозу при кормлении.
  renal_constraints:
  - 'КК >30 мл/мин: коррекция не требуется. КК <=30 мл/мин: осторожность, точное уменьшение не задано
    (§4.2, PDF с.3).'
  hepatic_constraints:
  - 'Лёгкая/средняя недостаточность, классы A/B Чайлд–Пью: 5 мг/сут первые две недели, затем по реакции
    до 10 мг. Тяжёлая C: пристальный контроль врача, без самостоятельного числового переноса (§4.2 с.3).'
  comorbidity_constraints:
  - 'Мания/гипомания, судороги/неконтролируемая эпилепсия, суицидальный риск, акатизия, риск кровотечения,
    гипонатремии и удлинения QT: ограничения/наблюдение по инструкции; числовых множителей для них нет.
    Для эсциталопрама дополнительно диабет и закрытоугольная глаукома.'
  interacting_drugs: []
  other_conditions: []
  exclusions:
  - Гиперчувствительность
  - Непроверенные противопоказания/взаимодействия не считать отсутствующими
  indication_status_in_russia: RU_registry_original_indication_confirmed
  source_refs: &id001
  - RU-ESC
