logic:
  representation: schedule
  conditions:
  - Диагноз, препарат и режим выбрал врач. Соответствие популяции/форме и ограничения источника подтверждены.
  - age > elderly_threshold
  actions:
  - Использовать только одну подтверждённую специальную ветку. Если совпали пожилой возраст, снижение
    печени и/или известный CYP2C19 — отдельное решение врача, без 5×0,5 и без автоматического выбора меньшей
    дозы.
  - Старт start один раз/сут; до after по ответу, фиксированный срок повышения не указан.
  parameter_refs:
  - start
  - after
  - frequency
  - elderly_threshold
  - adult_minimum
  - source_form_strengths
  - renal_caution_threshold
  source_refs: *id001
  clinician_choices:
  - Применимость при особых состояниях и взаимодействиях
  - Необходимость следующего условного шага
  missing_data_behaviour: Назвать обязательные неизвестные поля; результат insufficient_data. Справочные
    этапы можно показать как условные, без безусловной дозы пациенту.
  unsupported_case_behaviour: not_applicable для этой карточки; указать конкретную отсутствующую ветку,
    не запретить всё лечение.
  contraindicated_case_behaviour: Не выдавать дозовую схему противопоказанного сочетания; отобразить источник
    и причину.
  conflicts:
  - Не опубликована явная схема для одновременных специальных условий.
  composite_rule_dependencies: []
