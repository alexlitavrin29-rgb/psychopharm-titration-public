logic:
  representation: schedule
  conditions:
  - Врач выбрал диагноз, препарат, режим и конкретное действие; числовые условия проверяются по возрасту,
    форме, печени, текущей дозе и сроку. Это не универсальное подтверждение клинического допуска.
  - Начальный этап 25 мг не обрабатывается как обычный шаг +50; использовать соответствующую start-карточку.
  - Если врач выбрал повышение, вычислить только опубликованный шаг/интервал/предел. Если действие не
    выбрано, ответ/переносимость/приём разбираются отдельными полями; неизвестность не разрешает повышение.
  actions:
  - 'clinician_action=keep: сохранить current_dose; increase: проверить опубликованный шаг/минимальный
    срок/предел; decrease: точного меньшего шага здесь нет, clinician_choice; unknown/not_chosen: без
    автоматического изменения.'
  - При выполнении условий допустимый следующий вариант = current_dose + step, только если не превышает
    maximum и выдержан interval. Если вариант превышает maximum, не округлять до maximum как новой произвольной
    ступени. Врач решает дальнейшую тактику.
  - При достаточном эффекте повышение не требуется; при неприемлемой переносимости точная меньшая доза
    здесь не задана.
  - Если врач указал дозовое действие напрямую, проверить опубликованные дозу/интервал/предел; не превращать
    этот выбор в отметку отсутствия всех рисков. При отсутствии выбранного действия использовать отдельные
    ответ/переносимость/фактический приём.
  parameter_refs:
  - step
  - interval
  - maximum
  - first_standard_dose
  - frequency
  - adult_minimum
  - source_form_strengths
  source_refs: *id002
  clinician_choices:
  - Применимость при особых состояниях и взаимодействиях
  - Необходимость следующего условного шага
  missing_data_behaviour: Назвать обязательные неизвестные поля; результат insufficient_data. Справочные
    этапы можно показать как условные, без безусловной дозы пациенту.
  unsupported_case_behaviour: not_applicable для этой карточки; указать конкретную отсутствующую ветку,
    не запретить всё лечение.
  contraindicated_case_behaviour: Не выдавать дозовую схему противопоказанного сочетания; отобразить источник
    и причину.
  conflicts: []
  composite_rule_dependencies: []
  combination_justification: Самостоятельные поправки не перемножаются. Совпадение числа не подтверждает
    применимость их сочетания.
