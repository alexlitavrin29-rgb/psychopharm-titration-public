logic:
  representation: directed_switch_strategy
  conditions:
  - Показание/препарат выбраны врачом; взрослая применимость и форма подтверждены.
  actions:
  - A постепенно снижать по собственной инструкции и выбранному врачом плану.
  - 'B можно начать с первого дня снижения A: 25 мг однократно перед сном. Опубликовано разрешение перекрытия;
    ожидание последней дозы A не требуется этим способом перехода.'
  - 'Не вычислять универсальный washout из полувыведения. Не применять разрешение к флувоксамину: его
    сочетание с B противопоказано.'
  parameter_refs:
  - target_start
  - target_frequency
  - start_taper_day
  - hepatic_cutoff
  - depression_age_exclusion
  source_refs: *id001
  clinician_choices: &id003
  - Индивидуальные ступени снижения A, оценка риска отмены и решение о начале B.
  - Применимость B и обязательный контроль печёночных проб.
  missing_data_behaviour: Назвать обязательные неизвестные поля; результат insufficient_data. Справочные
    этапы можно показать как условные, без безусловной дозы пациенту.
  unsupported_case_behaviour: not_applicable для этой карточки; указать конкретную отсутствующую ветку,
    не запретить всё лечение.
  contraindicated_case_behaviour: Не выдавать дозовую схему противопоказанного сочетания; отобразить источник
    и причину.
  conflicts: []
  composite_rule_dependencies:
  - parox-taper-example
  combination_justification: Опубликованное правило B прямо отсылает к инструкции A. Классовое разрешение
    СИОЗС применяется к конкретной названной паре; точные дозы/темп A не выводятся из этого разрешения.
output:
  result_type: clinician_choice
  medication_inn: агомелатин
  dose_per_administration: null
  administrations_per_day: null
  total_daily_dose: null
  unit: mg
  formulation: *id002
  schedule: []
  warnings:
  - Переход требует расширенной ветки; 5–10 вопросов не обещаны.
  - 25 мг B — опубликованный старт, индивидуальный выход только после обязательных данных и плана A.
  - Числовой вывод относится к указанным дозовым условиям. Неоценённые модулем клинические обстоятельства
    не считаются отсутствующими; полный клинический допуск врач оценивает отдельно.
  mandatory_checks:
  - Печёночные пробы до старта; контроль примерно через 3/6/12/24 недели и после повышения по ОХЛП.
  clinician_decisions_remaining: *id003
  rounding_or_formulation_rule: Не округлять медицинскую дозу; использовать только разрешённую форму/деление.
    При невозможности дозы формой — явно сообщить.
  source_refs: *id001
