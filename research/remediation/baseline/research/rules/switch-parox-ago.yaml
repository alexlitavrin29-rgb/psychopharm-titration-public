schema_version: '1.0'
rule_id: switch-parox-ago
development_status: extracted_research_not_executable
language: ru
identity:
  title: 'пароксетин → агомелатин: старт B с первого дня снижения A'
  mode: switch
  drug_inn: null
  from_drug_inn: пароксетин
  to_drug_inn: агомелатин
  formulation: &id002
    from: Рексетин, таблетки 20 мг; половина 10 мг
    to: Вальдоксан, таблетки 25 мг, покрытые пленочной оболочкой
  route: oral
  diagnosis_label_ru: Депрессивный эпизод/рекуррентная депрессия у взрослых
  classification_system: МКБ-10
  diagnosis_code: F32/F33
  jurisdiction: RU_versioned_sources
applicability:
  population_description: Взрослые с самостоятельным депрессивным расстройством; B не применять от 75
    лет по ОХЛП.
  age_constraints:
  - minimum: 18
    inclusive: true
    unit: year
    source_ref: RU-AGO
    source_locator: §4.1–4.2, PDF с.1–2
  pregnancy: ОХЛП B рекомендует избегать назначения при беременности (§4.6 с.6); отдельное решение врача
    по A/B, без коэффициента.
  lactation: ОХЛП B требует решения прекратить вскармливание или терапию (§4.6 с.6); без коэффициента.
  renal_constraints:
  - Средняя/тяжёлая почечная недостаточность B требует осторожности, без отдельного числа.
  hepatic_constraints:
  - B противопоказан при печеночной недостаточности и АЛТ/АСТ >3 ВГН. До начала печёночные пробы обязательны
    всем.
  comorbidity_constraints: []
  interacting_drugs:
  - B противопоказан с флувоксамином/ципрофлоксацином (сильные CYP1A2-ингибиторы); проверять оба препарата,
    §4.3–4.5.
  other_conditions:
  - ОХЛП B прямо разрешает начало с 1-го дня постепенного снижения СИОЗС/СИОЗСН. Это классовое разрешение,
    применённое к явно указанному СИОЗС A; не исследование каждой пары.
  - Нет полного обязательного календаря доз A. Нужен выбор темпа врачом, а для пароксетина доступен отдельно
    маркированный взрослый пример.
  exclusions:
  - Печеночная недостаточность B; АЛТ или АСТ >3 ВГН; противопоказанный ингибитор CYP1A2; возрастная неприменимость;
    гиперчувствительность.
  indication_status_in_russia: RU_indication_present_in_original_registry_currency_separate
  source_refs: &id001
  - RU-PAROX
  - RU-AGO
  - RU-DEP
