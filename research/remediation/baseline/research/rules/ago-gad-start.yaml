logic:
  representation: conditional_source_rule
  conditions:
  - Применимость к указанному показанию/форме подтверждена в пределах дозового расчёта; это не полный
    клинический допуск.
  actions:
  - 25 мг один раз перед сном. При отсутствии положительной динамики через 4 недели возможно 50 мг; решение
    врача по пользе/риску и строгий контроль печёночных проб.
  - 'Возрастная граница: ГТР строго старше 65; БДР 75 и старше — не применять. Эти условия не взаимозаменяемы.'
  - Перед стартом проверяются АЛТ и АСТ отдельно. >3 ВГН хотя бы одной пробы исключает начало; ровно 3
    требует осторожности, не разрешение без прочих условий.
  - Сообщённая средняя/тяжёлая почечная недостаточность раскрывает отдельную ветку осторожности; не рассчитывать
    неизвестную числовую поправку и не считать неоценённое состояние нормой.
  parameter_refs:
  - start
  - frequency
  - conditional_higher_dose
  - earliest_higher_stage
  - age_limit
  - transaminase_limit
  source_refs: *id001
  clinician_choices:
  - Необходимость изменения лечения и неоценённые модулем клинические обстоятельства.
  missing_data_behaviour: insufficient_data с конкретным отсутствующим полем, без безусловной дозы.
  unsupported_case_behaviour: Назвать неприменимую ветку; не переносить другую форму/показание.
  contraindicated_case_behaviour: Не выдавать схему противопоказанного сочетания, указать источник.
  conflicts: []
  composite_rule_dependencies: []
  combination_justification: КР определяет клиническую область, инструкция — дозовые параметры; новые
    коэффициенты не добавлены.
