logic:
  representation: source_example
  conditions:
  - Показание/препарат выбраны врачом; взрослая применимость и форма подтверждены.
  actions:
  - Если врач выбрал пример, снижать суточную дозу на 10 мг через неделю до 20 мг; после 1 недели на 20
    мг отменить.
  - При симптомах во время снижения/после отмены возможно возобновление прежней дозы и последующее более
    медленное снижение; точный более медленный шаг источник не задаёт.
  - 'Исходная доза <20, недостижимые формы, высокий риск/тяжелая отмена: пример не достраивать автоматически.'
  parameter_refs:
  - weekly_decrement
  - decrement_interval
  - last_source_dose
  - last_hold
  source_refs: *id001
  clinician_choices: &id002
  - Выбор применимости примера; необходимость более медленного снижения; прежняя переносимая доза при
    симптомах.
  missing_data_behaviour: Назвать обязательные неизвестные поля; результат insufficient_data. Справочные
    этапы можно показать как условные, без безусловной дозы пациенту.
  unsupported_case_behaviour: not_applicable для этой карточки; указать конкретную отсутствующую ветку,
    не запретить всё лечение.
  contraindicated_case_behaviour: Не выдавать дозовую схему противопоказанного сочетания; отобразить источник
    и причину.
  conflicts: []
  composite_rule_dependencies: []
  combination_justification: КР Б5 определяет риск/ведение отмены, ОХЛП задаёт отдельно маркированный
    взрослый пример. Детский пример §4.8 не используется.
