  formulation: 'Золофт: таблетки, покрытые плёночной оболочкой; 50/100 мг'
  schedule: []
  warnings:
  - Условная схема источника, не автономное назначение. Максимум не является целью.
  - Подтвердить противопоказания и взаимодействия исходной инструкции.
  - Числовой вывод относится к указанным дозовым условиям. Неоценённые модулем клинические обстоятельства
    не считаются отсутствующими; полный клинический допуск врач оценивает отдельно.
  mandatory_checks:
  - Проверить соответствие источнику, указанное в applicability и inputs.
  clinician_decisions_remaining:
  - Размер каждого снижения
  - Темп и длительность по переносимости
  - Доза/условия последнего этапа; источник не даёт числового ответа
  rounding_or_formulation_rule: Не округлять медицинскую дозу; использовать только разрешённую форму/деление.
    При невозможности дозы формой — явно сообщить.
