logic:
  representation: conditional_source_rule
  conditions:
  - Применимость к указанному показанию/форме подтверждена в пределах дозового расчёта; это не полный
    клинический допуск.
  actions:
  - Постепенное снижение в течение 1–2 недель в §4.2; это не гарантированная общая продолжительность для
    любого пациента.
  - При выраженных симптомах рассмотреть прежнюю дозу, затем более постепенное снижение; точные ступени/последняя
    доза не заданы.
  parameter_refs:
  - source_taper_period
  source_refs: *id001
  clinician_choices:
  - Необходимость изменения лечения и неоценённые модулем клинические обстоятельства.
  missing_data_behaviour: insufficient_data с конкретным отсутствующим полем, без безусловной дозы.
  unsupported_case_behaviour: Назвать неприменимую ветку; не переносить другую форму/показание.
  contraindicated_case_behaviour: Не выдавать схему противопоказанного сочетания, указать источник.
  conflicts: []
  composite_rule_dependencies: []
  combination_justification: КР определяет клиническую область, инструкция — дозовые параметры; новые
    коэффициенты не добавлены.
