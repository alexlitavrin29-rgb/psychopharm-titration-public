logic:
  representation: schedule
  conditions:
  - Диагноз, препарат и режим выбрал врач. Соответствие популяции/форме и ограничения источника подтверждены.
  actions:
  - Постепенно снизить флуоксетин до before_stop и прекратить. Дозовых ступеней/сроков снижения к этой дозе
    страница не даёт.
  - После прекращения выдержать washout; конкретную длительность выбирает врач. Затем начать low dose SSRI;
    точное значение для сертралина этим переходом не задано.
  - Учитывать residual взаимодействия; 4 дня не означают полного исчезновения флуоксетина. Не заменять все
    переходы интервалом 4–7 дней.
  parameter_refs:
  - before_stop
  - washout
  - residual
  source_refs:
  - UK-SPS-SSRI
  clinician_choices:
  - Применимость при особых состояниях и взаимодействиях
  - Необходимость следующего условного шага
  missing_data_behaviour: Назвать обязательные неизвестные поля; результат insufficient_data. Справочные этапы
    можно показать как условные, без безусловной дозы пациенту.
  unsupported_case_behaviour: not_applicable для этой карточки; указать конкретную отсутствующую ветку, не
    запретить всё лечение.
  contraindicated_case_behaviour: Не выдавать дозовую схему противопоказанного сочетания; отобразить источник
    и причину.
  conflicts: []
  composite_rule_dependencies: []
  combination_justification: Самостоятельные поправки не перемножаются. Совпадение числа не подтверждает применимость
    их сочетания.
