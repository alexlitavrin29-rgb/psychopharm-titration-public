applicability:
  population_description: Взрослые с депрессией, для которых врач выбрал смену. Чистое тревожное показание,
    дети, беременность/лактация не получают автоматически этот иностранный протокол.
  age_constraints:
  - population: взрослые
    source_ref: UK-SPS-SSRI
    source_locator: Название страницы и Advice for all antidepressants
  pregnancy: Решение по применимости/пользе и риску отдельно; без опубликованной числовой поправки. Стандартная
    карточка не выдаёт автоматическую дозу при беременности.
  lactation: Проверять отдельные ограничения источника. Стандартная карточка не выдаёт автоматическую дозу
    при кормлении.
  renal_constraints: []
  hepatic_constraints: []
  comorbidity_constraints: []
  interacting_drugs: []
  other_conditions: []
  exclusions:
