logic:
  representation: schedule
  conditions:
  - Диагноз, препарат и режим выбрал врач. Соответствие популяции/форме и ограничения источника подтверждены.
  - Для обычного старта эсциталопрама возраст не старше target_elderly_threshold, нет нарушенной функции печени
    и известной слабой активности CYP2C19. Совпавшие специальные условия не комбинировать.
  actions:
  - 'Врач подтвердил, что прямой переход подходит: остановить исходный препарат, начать новый на следующий
    день. Перекрытие этим вариантом не предусмотрено.'
  - Стандартная начальная доза целевого препарата берётся из его инструкции для взрослой депрессии; это не
    эквивалент прежней дозы. При специальных условиях этот числовой вариант не применяется.
  parameter_refs:
  - next_day
  - target_start
  - frequency
  - target_adult_minimum
  - target_elderly_threshold
  source_refs:
  - UK-SPS-SSRI
  - RU-ESC-2025-JAN
  - RU-SER-2023
  clinician_choices:
  - Применимость при особых состояниях и взаимодействиях
  - Необходимость следующего условного шага
  missing_data_behaviour: Назвать обязательные неизвестные поля; результат insufficient_data. Справочные этапы
    можно показать как условные, без безусловной дозы пациенту.
  unsupported_case_behaviour: not_applicable для этой карточки; указать конкретную отсутствующую ветку, не
    запретить всё лечение.
  contraindicated_case_behaviour: Не выдавать дозовую схему противопоказанного сочетания; отобразить источник
    и причину.
  conflicts:
  - SPS обычно допускает прямой переход с прекращением A; российская копия инструкции A рекомендует постепенную
    отмену. Совместимость быстрого прекращения в конкретном случае не подтверждена этим исследованием. Не выбирать
    иностранную стратегию автоматически вместо инструкции РФ.
  composite_rule_dependencies:
  - 'UK-SPS-SSRI: направление и стратегия'
  - 'RU-ESC: стартовая доза/форма и применимость взрослой депрессии'
  combination_justification: 'Область обеих рекомендаций совпадает: взрослый с депрессией. SPS допускает начать
    новый препарат на следующий день; его собственная инструкция определяет обычный старт. Никакой эквивалентности
    доз не предполагается. Такая композиция является явно ограниченным техническим примером, требует клинического
    разбора перед применением; чистое тревожное показание не включено. Совпадение показания обосновывает исследовательский
    пример, но конфликт по прекращению A остаётся; композиция не считается завершённым российским правилом.'
