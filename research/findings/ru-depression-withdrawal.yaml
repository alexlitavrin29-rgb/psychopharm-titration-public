clinical_parameters: []
logic:
  representation: narrative_only
  conditions:
  - Показание и стратегию выбрал врач; ограничения источника проверяются отдельно.
  actions:
  - При плановой отмене снижать дозу постепенно; при высоком риске выбирать максимально медленное снижение без единой
    продолжительности и минимальной последней дозы.
  - 'Лёгкие симптомы: информирование о временном характере; умеренные: симптоматическая терапия по решению врача.'
  - При тяжёлых симптомах врач может возобновить АД в минимально эффективной или прежней дозе без симптомов, затем
    снижать более дробно и медленно.
  - Переход на флуоксетин при тяжёлой отмене СИОЗС/СИОЗСН — отдельная равноценная опция Б5 без числовой дозы и точного
    календаря; не автоматическая смена и не схема следующего дня.
  parameter_refs: []
  source_refs: *id001
  clinician_choices: &id002
  - Определение риска и тяжести симптомов
  - Каждая ступень и темп отмены
  - Выбор одной из опций при тяжёлых симптомах
  missing_data_behaviour: Назвать обязательные неизвестные поля; результат insufficient_data. Справочные этапы можно
    показать как условные, без безусловной дозы пациенту.
  unsupported_case_behaviour: not_applicable для этой карточки; указать конкретную отсутствующую ветку, не запретить
    всё лечение.
  contraindicated_case_behaviour: Не выдавать дозовую схему противопоказанного сочетания; отобразить источник и
    причину.
  conflicts: []
  composite_rule_dependencies: []
  combination_justification: Независимые правила не образуют автоматически полный клинический календарь.
